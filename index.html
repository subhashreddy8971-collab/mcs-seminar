<body>
<style>
:root{
  --bg:#0A1418; --panel:#122229; --panel2:#18303A; --ink:#EDF4F6; --muted:#9FB8C2; --dim:#6E8B96;
  --line:#22414E; --art:#FF5E6B; --ven:#4FB6F0; --gold:#F5C451; --green:#43DD97;
  --artS:rgba(255,94,107,.13); --venS:rgba(79,182,240,.13); --goldS:rgba(245,196,81,.13); --greenS:rgba(67,221,151,.13);
  --f:"Archivo","Helvetica Neue",Arial,sans-serif;
  --m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050D11;color:var(--ink);font-family:var(--f);overflow:hidden}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

#viewport{width:1600px;height:900px;position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;overflow:hidden;background:var(--bg)}

.slide{height:900px;padding:40px 60px 84px;display:flex;flex-direction:column;gap:16px;animation:entry .28s ease-out}
@keyframes entry{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}*{animation-duration:.001s!important}}

.eyebrow{font-family:var(--m);font-size:19px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-weight:600}
h1{font-size:76px;letter-spacing:-.03em;line-height:1.02;margin:0;max-width:22ch;font-weight:800}
h2{font-size:46px;letter-spacing:-.022em;line-height:1.06;margin:0;max-width:30ch;font-weight:700}
h2 em{font-style:normal;color:var(--art)}
h3{font-size:26px;margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.sub{font-size:33px;color:var(--muted);max-width:60ch;line-height:1.4}
.body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:14px}

/* points */
.pts{display:grid;gap:13px;align-content:start}
.pts.c1{grid-template-columns:1fr}.pts.c2{grid-template-columns:1fr 1fr}.pts.c3{grid-template-columns:repeat(3,1fr)}
.pt{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--art);border-radius:6px;padding:15px 18px}
.pt>b{display:block;font-size:30px;margin-bottom:7px;letter-spacing:-.01em}
.pt span b,.pt span i{display:inline;font-size:inherit;margin:0;color:var(--ink);font-weight:700}
.pt span{display:block;font-size:28px;color:var(--muted);line-height:1.45}
.pts.c1 .pt>b{font-size:31px}
.pt.v{border-left-color:var(--ven)}.pt.g{border-left-color:var(--gold)}.pt.e{border-left-color:var(--green)}

/* numbers */
.nums{display:grid;gap:12px}
.nums.n2{grid-template-columns:repeat(2,1fr)}.nums.n3{grid-template-columns:repeat(3,1fr)}.nums.n4{grid-template-columns:repeat(4,1fr)}
.num{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:15px 17px}
.num .k{font-family:var(--m);font-size:19px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:10px}
.num .v{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.num .v small{font-size:22px;font-weight:600;color:var(--dim);margin-left:4px}
.num .n{font-size:23px;color:var(--muted);margin-top:9px;line-height:1.4}
.num.bad .v{color:var(--art)}.num.good .v{color:var(--green)}.num.warn .v{color:var(--gold)}

/* table */
.tbl{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.tbl.compact table{font-size:23px}
.tbl.compact td{font-size:21px}
.tbl.compact th,.tbl.compact td{padding:5px 11px;line-height:1.2}
.tbl.compact thead th{font-size:18px}
table{border-collapse:collapse;width:100%;font-size:27px}
th,td{text-align:left;padding:8px 13px;border-bottom:1px solid var(--line)}
thead th{font-size:21px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel2);font-weight:700}
tbody th{font-weight:600;color:var(--muted);white-space:nowrap}
td{font-family:var(--m);font-size:26px;font-variant-numeric:tabular-nums}
tr:last-child th,tr:last-child td{border-bottom:0}
td.hi{color:var(--art);font-weight:600}td.lo{color:var(--green)}
tr.selected td,tr.selected th{background:var(--artS)}

/* steps */
.steps{display:grid;gap:14px;counter-reset:st}
.step{counter-increment:st;display:grid;grid-template-columns:52px 1fr;gap:16px;align-items:start;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 20px}
.step::before{content:counter(st,decimal-leading-zero);font-family:var(--m);font-size:22px;font-weight:600;color:var(--art)}
.step>b{display:block;font-size:26px;margin-bottom:5px}
.step span b{display:inline;font-size:inherit;margin:0;color:var(--ink)}
.step span{font-size:26px;color:var(--muted);line-height:1.45}

/* takeaway + source */
.take{background:var(--artS);border-left:4px solid var(--art);border-radius:0 6px 6px 0;padding:13px 22px;font-size:29px;line-height:1.4}
.take .tag,.co .tag,.pt .tag{font-size:15px;padding:2px 8px;vertical-align:middle;margin-left:6px}
.take b{color:var(--art);font-weight:700}
.foot{position:absolute;left:64px;right:64px;bottom:34px;display:flex;align-items:center;gap:14px}
.src{font-family:var(--m);font-size:14px;color:var(--dim);letter-spacing:.03em;display:flex;gap:7px;flex-wrap:wrap}
.src i{font-style:normal;border:1px solid var(--line);border-radius:3px;padding:2px 7px}
.src i.out{color:var(--gold);border-color:var(--gold)}
.foot .sp{flex:1}
.pill{font-family:var(--m);font-size:14px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}

/* cover */
.cover{justify-content:center;gap:28px}
.who{display:flex;gap:40px;align-items:flex-start;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.who .nm{font-size:30px;font-weight:800;letter-spacing:-.02em}
.who .nm span{font-size:18px;font-weight:600;color:var(--dim);margin-left:8px}
.who .af{font-size:19px;color:var(--muted);margin-top:6px;line-height:1.45}
.occasion:empty{display:none}

<script>
(function(){
var $=function(s){return document.querySelector(s);};
var slides=[];
function S(section,title,points,take,refs,extra){
  slides.push(Object.assign({section:section,title:title,points:points||[],take:take,refs:refs||[],type:'clinical'},extra||{}));
}
var A='Orientation', W='Why this matters', C='Cardiogenic shock', PH='Phenotyping';

/* ===================== §1 ORIENTATION ===================== */
S(A,'Mechanical Circulatory Support',[],'',
  [],
  {type:'cover',
   sub:'Temporary and durable mechanical support in cardiogenic shock and advanced heart failure.',
   notes:'Sixty seconds. Name yourself, name the sources, give them the two questions. Do not open with epidemiology — open with the split, because everything downstream hangs off it.'});

S(A,'Temporary and durable support: two different decisions',[
  'Question 1 — answered in minutes::Whose circulation do I support now, and with what? Which ventricle, is gas exchange failing too, how much flow, through what calibre of access — and will this device reduce or increase the load on the ventricle I am rescuing?',
  'Question 2 — answered over weeks::Whose heart do I replace the work of, for years? Does predicted mortality without a pump exceed mortality with one? Will the RV tolerate the LV being unloaded? Can this household run a driveline for five years?'],
  'A temporary device <b>gives you time to decide</b>. A durable device <b>is</b> the decision. Most avoidable harm comes from treating one as though it were the other.',
  [],{type:'clinical',cols:2,
   co:['crit','Why the distinction earns a slide','Escalating a patient who has no exit, and waiting for certainty while organs fail, are the same error in opposite directions.'],
   notes:'This is the spine of the talk. Say it slowly. Almost every error in this field comes from answering one question when you were asked the other.'});

/* ===================== §2 WHY THIS MATTERS ===================== */
S(W,'Incidence of cardiogenic shock','',
  'Cardiogenic shock now complicates <b>5\u201310% of acute myocardial infarctions</b>, and it has gone from an occasional problem to a fifth of everything admitted to a cardiac intensive care unit. <span class="tag pa">updated 2025</span>',
  ['National Inpatient Sample 2004\u20132018 [outside source]','ACC 2025 review [outside source]','ch05 p.2'],
  {type:'nums',nums:[
   ['CS hospitalisations per 100,000','122 \u2192 408','','2004 \u2192 2018. More than tripled.','bad'],
   ['Share of cardiac ICU admissions','8.8 \u2192 21.6','%','2007 \u2192 2018','bad'],
   ['CS complicating acute MI','5\u201310','%','Contemporary estimate',''],
   ['Cases analysed','1.25','million','US National Inpatient Sample, 2004\u20132018','']],
   co:['','And the patients have changed','Mean age at STEMI presentation <b>fell</b> from 70 to 68 years between 2004 and 2010, but with heavier burdens of diabetes, obesity, peripheral vascular disease and chronic kidney disease. Incidence rose in both sexes, and remains higher in women (11% vs 9.7%).'],
   notes:'The older chapters quote raw discharge counts from 2004 to 2014. The rate per 100,000 admissions is the better measure and it more than tripled. Say that this is partly real and partly better recognition and coding.'});

S(W,'Mortality in cardiogenic shock','',
  'Contrary to the impression given by older texts, <b>mortality has fallen</b> \u2014 but it remains around 40% and the range is wide. <span class="tag pa">updated 2025</span>',
  ['National Inpatient Sample 2004\u20132018 [outside source]','ACC 2025 review [outside source]','ch03 p.3'],
  {type:'nums',nums:[
   ['In-hospital mortality, all CS','49 \u2192 37','%','2004 \u2192 2018','good'],
   ['In-hospital mortality, AMI-CS','43 \u2192 34','%','2004 \u2192 2018','good'],
   ['Contemporary short-term mortality','40\u201350','%','Still, in most series','bad'],
   ['30-day mortality range','30\u201370','%','Depending on the four factors below','bad']],
   co:['crit','What drives the spread','Duration of shock \u00b7 initial SCAI stage and trajectory \u00b7 aetiology, whether ischaemic or not and which ventricle \u00b7 electrical and haemometabolic instability such as lactic acidosis, renal and hepatic dysfunction.'],
   notes:'Be precise here. The improvement is real and is attributed to earlier recognition, protocolised care and revascularisation \u2014 not to any single device. But surviving the admission is not the endpoint: many are left with myocardial injury that carries a poor longer-term prognosis.'});

S(W,'Barriers to mechanical circulatory support',['They die before MCS is considered::The commonest reason, and the one most amenable to a referral pathway.','Anatomy or physiology makes it unfeasible::Non-dilated ventricles, congenital anatomy, RV-predominant disease.','Complications during temporary support::Preclude going on to a durable device.'],'',
  ['ch04 p.1','ch04 p.2','ch04 p.3'],
  {type:'clinical',cols:3,
   nums:[['People with HF in the US','&gt;6','million','',''],['Heart transplants per year','~3000','','Donor pool essentially fixed',''],['Already on an LVAD at transplant','&gt;50','%','Which caps bridge-to-transplant','warn']],
   notes:'Six million with heart failure, three thousand transplants. Two of these reasons are ours to fix: dying before referral, and referral once end-organ injury is irreversible. Neither is a technology problem.'});

/* ===================== §3 CARDIOGENIC SHOCK ===================== */

S(W,'Modifiable barriers to referral',['Non-cardiac comorbidity::Makes MCS problematic or of minimal benefit to overall health.','Socioeconomic factors::Outpatient management of a driveline is not possible for everyone.','Some patients do not wish to::And that is a complete answer.'],
  'Widening MCS requires fewer adverse events and better cost-effectiveness — not more enthusiasm.',
  ['ch04 p.1','ch04 p.2','ch04 p.3'],
  {type:'clinical',cols:3,
   nums:[['People with HF in the US','&gt;6','million','',''],['Heart transplants per year','~3000','','Donor pool essentially fixed',''],['Already on an LVAD at transplant','&gt;50','%','Which caps bridge-to-transplant','warn']],
   notes:'Six million with heart failure, three thousand transplants. Two of these reasons are ours to fix: dying before referral, and referral once end-organ injury is irreversible. Neither is a technology problem.'});

/* ===================== §3 CARDIOGENIC SHOCK ===================== */
S(C,'How cardiogenic shock is defined',[
  'Pressure::Systolic &lt;90 mm Hg for longer than 30 minutes, or catecholamines to hold SBP ≥90.',
  'Congestion::Clinical signs of pulmonary congestion.',
  'Plus one sign of malperfusion::Altered mental status · cold clammy skin and limbs · oliguria &lt;30 mL/h · arterial lactate &gt;2.0 mmol/L.'],
  'This draws a hard line across what is really a spectrum. Some patients slide into shock over weeks and good clinicians still miss it — that slow type is not in the trial definition at all.',
  ['ch02 p.3'],
  {cols:3,co:['','Where the description came from','Descriptions from the 1860s already listed cold pale skin, sweating, a weak thready pulse, anxiety and confusion. Blood pressure was added in the 19th century and urine output in the 20th. The clinical picture has not changed.'],
   notes:'Read the trial definition aloud — it is what most RCTs enrolled on. Point out that the clinical description is very old; only the blood pressure and urine output thresholds are modern.'});

S(C,'Three ways cardiogenic shock presents','',
  'You have minutes, hours, or days \u2014 depending on which of the three this is. Getting that wrong is how patients die.',
  ['ch02 p.3','ch02 p.4','ch02 p.14'],
  {type:'compare',
   cols_:['','Catastrophic','Acute severe','Indolent progressive'],
   rows:[
    ['Scenario','VF or PEA arrest','Acute MI, fulminant myocarditis','Progressive CHF, stage C → D'],
    ['Physiology','<hi>Complete cessation of cardiac function</hi>','Severe reduction in CO and BP','Moderate reduction in CO and BP'],
    ['Window','<hi>&lt;5 min</hi> for CPR or restoration','Restore CO and BP within 1–6 h','Hours to days'],
    ['Goal','Avoid anoxic brain injury','Avoid SIRS and multiorgan failure','Lower filling pressures; evaluate for transplant, LVAD or hospice']],
   notes:'The time row is the point. The CNS has the highest oxygen requirement of any organ — without CPR in the first minutes, nothing you do to the circulation afterwards matters.'});

S(C,'How a heart attack causes shock',[
  'A very large infarct::Enough muscle lost that output collapses outright.',
  'A small infarct on an already bad heart::In an ischaemic cardiomyopathy, a modest new infarct is enough.',
  'Severe ischaemia with no necrosis at all::Output and pressure can fall substantially without any myocardial injury.',
  'Right ventricular infarction::With the left ventricle relatively spared \u2014 a distinct clinical picture with its own shock.'],
  'And then the mechanical complications: <b>papillary muscle rupture, acute ventricular septal defect, and free wall rupture</b> \u2014 severe, often fatal, and surgical.',
  ['ch02 p.4'],{cols:2,
  notes:'Infarction is the commonest cause but by no means the only one. Ask the room to name the mechanical complications before you show them.'});

S(C,'Cardiac index alone does not define shock',[
  'Shock is a relationship, not a value::It means the heart is not putting out enough for what the kidneys, liver, brain and gut need. Cardiac index runs on a scale, not a switch.',
  'The trap: normal-output shock::Output can be almost normal if the vessels are very dilated. Work out the SVR — it tells you which type you are dealing with in seconds.',
  'And they need opposite drugs::Judicious vasodilators markedly improve output in vasoconstriction and are <b>absolutely contraindicated</b> in vasodilatory states, where vasopressin stores are depleted.'],
  'Get this wrong at the start and the tissues stay underperfused for longer. Angiotensin II was approved in late 2017 for high-output shock.',
  ['ch02 p.6','ch02 p.13'],
  {cols:3,
   notes:'Push back on treating 2.2 as magic. The chapter is explicit: there is no absolute value. That is why SvO2 and lactate matter more than the index itself.'});

S(C,'Non-coronary causes of cardiogenic shock',['Myocarditis::Acute and especially giant cell myocarditis can stop myocardial contraction almost completely, or cause relentless arrhythmia needing ECMO.','Takotsubo::Mimics infarction in the emergency department, and carries a reported <b>9% incidence of cardiogenic shock</b>.','Valve disease::Severe aortic, mitral, pulmonary or tricuspid lesions can become life-threatening when they decompensate.'],'',
  ['ch02 p.4','ch02 p.5','ch02 p.6'],{cols:3,
  notes:'Giant cell myocarditis and Takotsubo are the two most likely to be missed by a general team. The 9% figure for Takotsubo surprises people.'});


S(C,'Obstructive, chronic and toxic causes',['Obstruction and outflow::Cardiac tamponade \u00b7 large pulmonary embolus \u00b7 acute aortic dissection with regurgitation, tamponade or rupture.','Chronic disease tipping over::End-stage ischaemic or non-ischaemic cardiomyopathy \u00b7 adult congenital heart disease decompensating decades after palliation.','Toxins::Long-standing alcohol, methamphetamine and other sympathomimetics, and chemotherapy agents.'],
  'Long-standing heart failure that has been stable for decades can slide into shock either rapidly or so slowly that nobody notices.',
  ['ch02 p.4','ch02 p.5','ch02 p.6'],{cols:3,
  notes:'Giant cell myocarditis and Takotsubo are the two most likely to be missed by a general team. The 9% figure for Takotsubo surprises people.'});

S(C,'How lactic acidosis makes shock worse',['1 · Contractility::Acidosis interferes with Ca²⁺ binding by myocytes — reduced myofilament Ca²⁺ sensitivity, directly impairing contractility.','2 · Vascular tone::K⁺ egress hyperpolarises smooth muscle, so the vessels that should defend blood pressure cannot constrict.'],'',
  ['ch02 p.8','ch02 p.9'],
  {cols:2,notes:'Most people treat lactate as a number that rises when things are bad. This slide says the acidosis is causal — a feed-forward loop, and why you cannot pressor your way out of profound acidosis.'});


S(C,'Acidosis reduces the response to drugs',['3 · Catecholamine response::Adrenoreceptor internalisation. Sensitivity to noradrenaline falls — and to angiotensin II as well.','4 · Cell death::Low intracellular pH activates BNIP3, promoting apoptosis and inducing nitric oxide production.'],
  'If shock goes on and the vessels start to dilate, smooth muscle stops working properly and <b>shock can become irreversible</b>. Shock has then become irreversible.',
  ['ch02 p.8','ch02 p.9'],
  {cols:2,notes:'Most people treat lactate as a number that rises when things are bad. This slide says the acidosis is causal — a feed-forward loop, and why you cannot pressor your way out of profound acidosis.'});

S(C,'Lactate as a biomarker','',
  'The liver and kidneys clear lactate. When they fail it stays high for hours after you have fixed the circulation — a lactate that will not fall may mean poor clearance, not ongoing shock.',
  ['ch02 p.9','ch02 p.10'],
  {type:'nums',nums:[
    ['Post-arrest survival, lactate &lt;5 mmol/L','61','%','','good'],
    ['Post-arrest survival, lactate &gt;10 mmol/L','8','%','','bad'],
    ['What it means','aerobic → anaerobic','','Higher levels = greater anaerobic reliance and more acidosis',''],
    ['What to follow','the trend','','A fall with treatment is associated with improved outcome','good']],
   notes:'Two numbers to remember: under 5 and over 10. Then the ward-round caveat about clearance — do not chase a lactate blindly once the liver and kidney are failing.'});

S(C,'Inflammation in cardiogenic shock',['IL-6 tracks multiorgan failure::Significantly higher in CS than in other ICU patients without shock; very high levels associate with MSOF. IL-6, -7, -8 and -10 all predict mortality.','TNF-α is highest in vasodilatory shock::Peaks higher in CS than in MI without shock, and higher still when a vasodilatory component is present.'],'',
  ['ch02 p.10','ch02 p.11','ch02 p.12','ch05 p.1'],
  {cols:2,co:['','Biomarkers you can actually order','NT-proBNP &gt;12,000 carries a very poor prognosis, especially with high IL-6. Procalcitonin may be elevated in CS <i>without</i> bacterial infection — do not read it as proof of sepsis.'],
   notes:'This explains the otherwise baffling bedside observation that they stay hypotensive after the cardiac output is normal.'});


S(C,'Nitric oxide and the TRIUMPH trial',['iNOS is the problem isoform::Produced in large quantities, contributing to hypotension; high NO also impairs mitochondrial function and suppresses myocardial function.','TRIUMPH::Tilarginine raised systolic pressure but the trial was <b>stopped for futility</b>. It blocks all forms of nitric oxide synthase, including the ones the body needs.'],
  'The small vessels stay damaged even after the output is back. <b>Getting the pump working is not the same as getting the patient better.</b>',
  ['ch02 p.10','ch02 p.11','ch02 p.12','ch05 p.1'],
  {cols:2,co:['','Biomarkers you can actually order','NT-proBNP &gt;12,000 carries a very poor prognosis, especially with high IL-6. Procalcitonin may be elevated in CS <i>without</i> bacterial infection — do not read it as proof of sepsis.'],
   notes:'This explains the otherwise baffling bedside observation that they stay hypotensive after the cardiac output is normal.'});

S(C,'End-organ damage in cardiogenic shock','',
  'It is back-pressure, not just low forward flow. A high CVP is <b>rare in other kinds of shock but common here</b> — it raises pressure in the tissues and abdomen, and severe TR blocks blood draining out of the kidney.',
  ['ch02 p.12','ch02 p.13'],
  {type:'nums',nums:[
    ['Mortality if renal failure in first 24 h','87','%','Post-MI cardiogenic shock','bad'],
    ['Mortality if it did not develop','53','%','','warn'],
    ['Liver: ischaemic necrosis','zone 3','','Centrilobular, without inflammation. AST/ALT &gt;10×, bigger bilirubin rise.',''],
    ['Liver recovery','days','','— if shock reverses fast enough. Bilirubin independently predicts mortality.','good']],
   co:['crit','Lungs','Breathing fails from the effort and from fluid in the lungs. Capillaries start to leak, so ARDS can develop <b>even when filling pressures are controlled</b>.'],
   notes:'87 versus 53 percent is the number to leave them with. And the mechanism is not simply low forward flow — it is high CVP, which is the thing you can actually treat.'});

/* ===================== §4 PHENOTYPING ===================== */
S(C,'The neurohormonal response',[
  'Sympathetic activation is the hallmark::Through carotid and aortic baroreceptors. Tachycardia, vasoconstriction and cold clammy skin are all direct noradrenaline effects.',
  'Levels are higher and last longer than in MI alone::And the compensation has a cost \u2014 very high noradrenaline is <b>directly toxic to myocytes</b>, driving further cell death by apoptosis.',
  'Renin rises too::Especially when blood pressure is low. That raises angiotensin II and aldosterone, defending pressure and retaining sodium.',
  'And the markers follow::Higher aldosterone predicts worse outcome after infarction. <b>NT-proBNP above 12,000</b> carries a very poor prognosis, especially alongside a high IL-6.'],
  'The compensation that keeps the patient alive in the first hour is the same process that kills myocytes over the next few days.',
  ['ch02 p.7','ch02 p.8'],{cols:2,
  notes:'This is the physiological argument for getting the patient off high-dose catecholamines and onto mechanical support sooner rather than later.'});

S(PH,'SCAI shock stages','',
  'A 2025 expert consensus keeps these stages but adds a <b>three-axis model</b> \u2014 aetiology, phenotype, and fixed risk factors \u2014 for repeated reassessment rather than a single label at admission. <span class="tag pa">updated 2025</span>',
  ['ch66','ch02 p.3','2025 ACC expert consensus [outside source]'],
  {type:'lab',lab:'scai',
   notes:'Click along the ladder with the audience. The teaching point is that SCAI is a trajectory, not a snapshot — a patient at C improving and a patient at C deteriorating are different patients.'});

S(PH,'Mortality in acute heart failure','',
  'Two-thirds of patients admitted with heart failure already carry the diagnosis. For most, the line between acute and chronic is simply <b>where you are standing in time</b>.',
  ['ch03 p.2','ch03 p.3'],
  {type:'nums',nums:[
   ['In-hospital mortality','3\u20134','%','More than 900,000 US admissions a year',''],
   ['At 30 days','10\u201312','%','','warn'],
   ['At 1 year','30\u201340','%','','bad'],
   ['Readmitted within a year','45\u201365','%','','bad']],
   notes:'Give them these before the shock numbers. It sets the baseline: plain acute heart failure already has a one-year mortality of a third.'});

S(PH,'INTERMACS profiles','',
  'Profiles <b>1 and 2</b> are in active cardiogenic shock and correspond roughly to <b>SCAI C–E</b>. Profile 3 is the durable-MCS decision zone. Profiles 4–7 are where the field has repeatedly tried and failed to show benefit.',
  ['ch02 p.3','ch03 p.4','ch05 p.2'],
  {type:'compare',
   cols_:['Profile','Clinical description','Ward shorthand','Zone'],
   rows:[
    ['1','<hi>Critical cardiogenic shock</hi>','“Crash and burn”','<hi>tMCS territory</hi>'],
    ['2','<hi>Progressive decline</hi>','“Sliding fast on inotropes”','<hi>tMCS territory</hi>'],
    ['3','Stable but inotrope dependent','“Inpatient/outpatient inotropes”','Durable MCS decision zone'],
    ['4','Recurrent severe CHF','“Symptoms on oral Rx at home”','Ambulatory'],
    ['5','Exertion intolerant','“Housebound, symptoms with ADL”','Ambulatory'],
    ['6','Exertion limited','“Walking wounded”','Ambulatory'],
    ['7','Advanced NYHA IIIb','Advanced but not critical','Ambulatory']],
   notes:'Teach the shorthand — it is what actually gets said. Note profile 1 at implant fell 16% to 14% and profile 2 from 43% to 36% between eras: a deliberate change in selection, not in disease.'});

S(PH,'Prognosis at the time of admission','',

S(PH,'Survival by INTERMACS profile on medical therapy','',

S(PH,'The haemodynamic definition of shock','',

S(PH,'Cardiac amyloidosis',[

  'Prognosis is worse than other causes of HFpEF::In the transthyretin amyloid trial of tafamidis, <b>43% of the placebo group had died by 30 months</b> \u2014 and most were only NYHA II\u2013III.',

S(PH,'Mode of death by NYHA class','',
  'Sudden death is <b>commoner in mild</b> heart failure. In advanced disease, pump failure takes over. An ICD treats the problem that is going away. MCS treats the one replacing it.',

/* ===================== RENDER ===================== */
function esc(t){return String(t==null?'':t);}
function hi(t){return esc(t).replace(/<hi>/g,'<span class="hitd">').replace(/<\/hi>/g,'</span>').replace(/<lo>/g,'<span class="lotd">').replace(/<\/lo>/g,'</span>');}

function ptsHTML(points,cols){
  if(!points||!points.length) return '';
  var tone=['','v','g','e','','v'];
  var h='<div class="pts c'+(cols||2)+'">';
  points.forEach(function(p,i){
    var parts=String(p).split('::');
    h+='<div class="pt '+tone[i%6]+'"><b>'+parts[0]+'</b><span>'+(parts[1]||'')+'</span></div>';
  });
  return h+'</div>';
}
function numsHTML(nums){
  if(!nums||!nums.length) return '';
  var n=nums.length<=3?nums.length:4;
  var h='<div class="nums n'+n+'">';
  nums.forEach(function(x){
    h+='<div class="num '+(x[4]||'')+'"><span class="k">'+x[0]+'</span>'+
       '<div class="v">'+x[1]+(x[2]?'<small>'+x[2]+'</small>':'')+'</div>'+
       (x[3]?'<p class="n">'+x[3]+'</p>':'')+'</div>';
  });
  return h+'</div>';
}
function tblHTML(cols,rows){
  var h='<div class="tbl'+(rows.length>=6?' compact':'')+'"><table><thead><tr>';
  cols.forEach(function(c){h+='<th>'+c+'</th>';});
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><th>'+r[0]+'</th>';
    for(var i=1;i<r.length;i++) h+='<td>'+hi(r[i])+'</td>';
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}
function coHTML(co){
  if(!co) return '';
  return '<div class="co '+(co[0]||'')+'"><b>'+co[1]+'</b><span>'+co[2]+'</span></div>';
}
function srcHTML(refs){
  if(!refs||!refs.length) return '';
  return '<div class="src">'+refs.map(function(r){
    return '<i'+(/outside/i.test(r)?' class="out"':'')+'>'+r+'</i>';}).join('')+'</div>';
}


/* ===================== §5 UNLOADING PHYSIOLOGY ===================== */
var U='Unloading physiology', TM='Temporary support', RP='Rotary pump physiology';

S(U,'Goals of mechanical circulatory support',[
  'Improve peripheral flow::Restore cardiac output and end-organ perfusion. A pump that moves blood does this regardless of where it takes it from.',
  'Reduce ventricular oxygen consumption::Make the pressure–volume loop smaller. That only happens if the device takes work <i>off</i> the ventricle — and not every device does.',
  'Support is not additive::Devices that cross the aortic valve or the septum take blood away from the LV, so the heart\u2019s own stroke volume falls. You are replacing flow, not adding to it.',
  'All of them share two constraints::Every temporary device is preload- and afterload-dependent, and every one of them requires systemic anticoagulation.'],
  'Loop area is stroke work, and stroke work is myocardial oxygen consumption. <b>That is the number the next slide moves.</b>',
  ['ch66','ch05 p.3'],{cols:2,
  notes:'Make them separate the two goals before the lab. A device can raise the blood pressure and simultaneously make the ventricle work harder — that is the whole story of VA-ECMO.'});

S(U,'Loop area, stroke work and oxygen use',[
  'The loop area is stroke work::The mechanical work the ventricle does on each beat. Add the potential energy left in the wall at end-systole and you have the pressure\u2013volume area.',
  'And that tracks oxygen use::Pressure\u2013volume area correlates closely with myocardial oxygen consumption. Shrink the area and you cut the oxygen the muscle needs.',
  'Which is the whole point in ischaemia::In shock after infarction, supply is already fixed or falling. The only lever you control is demand.',
  'Pressure costs more than volume::Pressure work is metabolically more expensive than volume work. That is why a device that drops volume but raises pressure may not help the muscle at all.'],
  'So \u201cdid the blood pressure improve\u201d is the wrong question. The right one is <b>did the loop get smaller</b>.',
  ['ch66','ch05 p.7'],{cols:2,
  notes:'This is the conceptual heart of the talk and it is worth slowing down for. Everything in the PV lab afterwards is an illustration of this one idea.'});

S(U,'Pressure–volume loop simulation','','',['ch66','ch05 p.12','ch02 p.6'],
  {type:'lab',lab:'pv',
   notes:'Four to five minutes, and drive it with the audience. Start at No support and name the corners. Then Impella — watch the isovolumic corners disappear and the loop collapse. Then VA-ECMO unvented — the loop climbs and LVEDP rises; that is the patient who floods on full flow. Then add the vent and watch it rescue. Drag the slider to show it is dose-dependent.'});

S(U,'Effect of each device on preload and afterload','',
  'Three of the four left-sided devices reduce LV afterload. <b>TandemHeart raises it</b>, because it returns into the femoral artery — and VA-ECMO raises it hardest of all.',
  ['ch66','ch05 p.6'],
  {type:'compare',
   cols_:['','IABP','Impella CP','Impella 5.5','TandemHeart','VA-ECMO'],
   rows:[
    ['Inflow','—','LV','LV','LA','RA'],
    ['Outflow','—','Aorta','Aorta','Femoral artery','Femoral artery / aorta'],
    ['LV preload','↓ slightly','<hi>↓↓</hi>','<hi>↓↓↓</hi>','<hi>↓↓</hi>','↓'],
    ['LV afterload','↓','↓','↓','<hi>↑</hi>','<hi>↑↑</hi>'],
    ['Max flow (L/min)','1','3.5','6','4','&gt;5'],
    ['Cannula','8 Fr','14 Fr','23 Fr','21 Fr','Variable']],
   notes:'Work down the afterload row. That single row predicts who develops pulmonary oedema on support.'});

/* ===================== §6 IABP ===================== */
S(U,'Limitations of ventricular unloading',[
  'It does not restore the microcirculation::Even with normal cardiac output, small-vessel dysfunction persists \u2014 which is why blood pressure, coagulation and organ function can stay deranged.',
  'It does not switch off the inflammation::Interleukin-6 and the APACHE II score predict death better than cardiac power or cardiac index do.',
  'It does not clear the lactate any faster than the liver and kidney can::As those organs fail, lactate stays high for hours after you have fixed the haemodynamics.',
  'And it does not buy time indefinitely::For most patients temporary support offers a short-term survival gain. Many still die of heart failure in the weeks to months after discharge.'],
  'Improving haemodynamics and end-organ function with temporary support <b>does not by itself lower the risk of later durable surgery</b>. The numbers get better; the patient stays high-risk.',
  ['ch05 p.13','ch05 p.15','ch02 p.9','ch66'],{cols:2,
  notes:'Put this immediately after the enthusiasm of the PV lab. It stops the audience concluding that a smaller loop equals a saved patient.'});

S(TM,'How the intra-aortic balloon pump works','','',['ch05 p.7','ch05 p.8'],
  {type:'lab',lab:'iabp',
   notes:'Toggle off and on. Point at the two changes: the augmented diastolic peak (coronary perfusion) and the lower end-diastolic pressure (afterload reduction). Then give them the number — 40 cc a beat, about 1 L/min. It assists; it does not unload.'});

S(TM,'IABP-SHOCK II and the routine indication','',
  'So why is it still the most-used MCS device on earth? 8 French, low anticoagulation, placeable at the bedside — and many patients decompensating from chronic systolic HF are adequately supported by it without large-bore access.',
  ['ch05 p.8','ch66'],
  {type:'nums',nums:[
   ['Patients randomised','600','','Usual care vs IABP in post-ACS shock',''],
   ['30-day mortality — IABP','40','%','','bad'],
   ['30-day mortality — control','41','%','','bad'],
   ['Lactate, renal function, pressor dose','no change','','IABP improved none of them','']],
   co:['crit','What the guidelines did','The position has hardened since the textbook. ESC already recommended against routine use. The <b>2025 ACC/AHA acute coronary syndrome guideline downgraded routine IABP to Class 3 — no benefit</b>. It is still used as an ambulatory bridge to transplant via the axillary artery, partly driven by the October 2018 UNOS allocation change. <span class="tag pa">updated 2025</span>'],
   notes:'Three trials of IABP versus medical therapy, all negative. Four small trials against percutaneous devices, also negative. Haemodynamics improve; survival does not.'});

/* ===================== §13 ROTARY PUMP PHYSIOLOGY (preview) ===================== */
S(RP,'The pressure–flow curve','','',['ch07 p.9','ch07 p.10','ch07 p.11'],
  {type:'lab',lab:'hq',
   notes:'This is the slide that separates a registrar talk from a cardiology talk. Flow is proportional to speed and inversely proportional to ΔP — aorta minus LV. During systole the native ventricle raises LV pressure, ΔP falls, and flow rises. That swing IS the pulse. Toggle axial versus centrifugal and watch the swing change. Then make the clinical point: a flat curve gives more pulsatility and less suction, but is more sensitive to afterload.'});

S(TM,'DanGer Shock trial','',
  'The benefit held up long term. In extended follow-up, mortality was <b>52.5% versus 68.8%</b>, hazard ratio 0.70, and patients gained on average about <b>600 extra days alive</b>. <span class="tag pa">updated 2025</span>',

/* ===================== §8 TANDEMHEART ===================== */
S(TM,'TandemHeart: haemodynamic effect',['The circuit::A 21 Fr transseptal cannula drains the left atrium; an extracorporeal centrifugal pump returns blood to a 15–17 Fr femoral arterial cannula. Up to 5 L/min at 7500 rpm.','The afterload penalty::It is the <b>only left-sided device in the table that increases LV afterload</b>, because it returns into the femoral artery rather than the aortic root.'],'',
  ['ch05 p.8','ch66'],{cols:2,
  notes:'Placement needs fluoroscopic or echo guidance and a transseptal puncture — which is why it lives in fewer centres than Impella.'});

/* ===================== §9 VA-ECMO ===================== */

S(TM,'TandemHeart: indications and risks',['The trap you must know::Catheter dislodgement into the right atrium creates a <b>right-to-left shunt</b> in patients without an oxygenator.','Where it uniquely fits::Atrial inflow makes it usable with LV thrombus — but not with atrial thrombus. Suitable in severe aortic stenosis; risks LV distension in severe aortic insufficiency.'],
  'The numbers improve a lot, but bleeding is common. In randomised trials, survival is no better than IABP alone.',
  ['ch05 p.8','ch66'],{cols:2,
  notes:'Placement needs fluoroscopic or echo guidance and a transseptal puncture — which is why it lives in fewer centres than Impella.'});

/* ===================== §9 VA-ECMO ===================== */
S(EC,'VA-ECMO: the circuit and its effect on the LV',['The circuit::Venous cannula 18–28 Fr from femoral vein to RA; centrifugal pump; membrane oxygenator; arterial return 15–19 Fr. Essentially a bypass circuit without reservoir or cardiotomy suckers.','The flows::4–6 L/min peripherally, over 5 L centrally. It supports both ventricles <i>and</i> the lungs.'],'',
  ['ch05 p.11','ch05 p.12','ch66'],{cols:2,
  notes:'Go back to the PV loop lab here if they need convincing — unvented VA-ECMO is the one state where the loop climbs instead of collapsing.'});


S(EC,'Reasons for increased VA-ECMO use',['Why its use exploded after 2010::Rapidity of deployment, better cannulas and oxygenators, portability, reimbursement — and it is now placed by interventionalists, intensivists and ED staff, not only surgeons.','The cost::Blood pushed backwards up the aorta <b>raises LV afterload</b>. The aortic valve struggles to open, wall tension rises, blood sits still in the ventricle and clots.'],
  'If both ventricles and the lungs are failing, this is the right device. If the ventricle is not ejecting at all, it is also the one most likely to do harm.',
  ['ch05 p.11','ch05 p.12','ch66'],{cols:2,
  notes:'Go back to the PV loop lab here if they need convincing — unvented VA-ECMO is the one state where the loop climbs instead of collapsing.'});

S(EC,'Differential hypoxaemia (Harlequin syndrome)',[
  'The setup::The LV starts to recover while the native lungs are still failing. Now two circulations compete in the aorta.',
  'The consequence::The recovering ventricle pushes <b>deoxygenated</b> blood forward into the aortic root — so the <b>coronaries and brain</b> get the worst blood, while the legs get well-oxygenated blood from the ECMO.',
  'Why you will miss it::A femoral arterial line samples ECMO blood and looks perfect. The mixing point sits somewhere in the aorta and moves as the heart recovers.',
  'What to do::<b>Sample the right radial artery.</b> Then optimise the ventilator, add an upper-body return, or convert to VAV-ECMO.'],
  'The source is explicit: in peripheral VA-ECMO a <b>radial</b> arterial line should be used to monitor blood gases for early detection.',
  ['ch05 p.12'],{cols:2,
  notes:'Ask the room which arterial line they would want in a femoral VA-ECMO patient. Most will say right radial only after prompting. This point is commonly tested.'});

S(EC,'Other complications of VA-ECMO','',
  'You can prevent the leg ischaemia. Putting a small perfusion cannula into the femoral or foot artery is now routine with any femoral device.',
  ['ch05 p.12'],
  {type:'nums',nums:[
   ['Local arterial injury','rupture','dissection','At the cannulation site','bad'],
   ['Distal limb ischaemia','partial or complete','occlusion','Of the ipsilateral femoral artery','bad'],
   ['LV cavity and aortic root','thrombosis','','From blood stasis in an unejecting ventricle','bad'],
   ['Retrograde flow','atheroembolism','','To upper extremities and brain','bad']],
   co:['crit','And the one that is not mechanical','SIRS is the main obstacle to successful shock resuscitation. Severity of multisystem dysfunction (APACHE II) and SIRS biomarkers including IL-6 are <b>more predictive of mortality than cardiac power or cardiac index</b> — which is why fixing the numbers does not fix the patient.'],
   notes:'Four randomised trials showed no mortality benefit. The next slide gives the largest of them.'});

/* ===================== §10 VENTING ===================== */
S(EC,'VA-ECMO: randomised trial evidence','',
  'Routine, unselected VA-ECMO in infarct-related shock does not save lives and causes harm. That does not mean never — it means <b>not routinely, and not without a clear reason</b>.',
  ['ch66','ECLS-SHOCK, NEJM 2023 [outside source]','2025 ACC/AHA ACS guideline [outside source]'],
  {type:'nums',nums:[
   ['ECLS-SHOCK, patients randomised','420','','44 centres, Germany and Slovenia',''],
   ['30-day death — ECMO','47.8','%','','bad'],
   ['30-day death — no ECMO','49.0','%','No difference','bad'],
   ['Harms','bleeding','limb ischaemia','Significantly more in the ECMO group','bad']],

S(EC,'Left ventricular venting during VA-ECMO',['Concomitant LV vent::A percutaneous microaxial pump on top of ECMO — “ECPELLA”. Reported to improve survival.','Atrial septostomy::Decompresses the left atrium directly.'],'',
  ['ch66','ch05 p.12'],{cols:2,
  co:['good','Go back to slide 19 and show it','Compare <i>VA-ECMO (unvented)</i> with <i>VA-ECMO + LV vent</i> on the pressure–volume lab. Same systemic support; end-diastolic pressure falls from the mid-thirties back to single figures.'],
  notes:'The chapter says venting is mandated where the aortic valve does not open, or opens infrequently. Say that sentence as written — it is the strongest recommendation in the acute section.'});


S(EC,'Further venting strategies',['Facilitated venting with inotropes::Restores enough ejection to open the aortic valve.','An IABP::The cheapest vent, and often the one that is already in.'],
  'If you do not unload it, oxygen demand rises, the ventricle may never recover, and the lungs can bleed. In a ventricle that is not moving, venting is not optional.',
  ['ch66','ch05 p.12'],{cols:2,
  co:['good','Go back to slide 19 and show it','Compare <i>VA-ECMO (unvented)</i> with <i>VA-ECMO + LV vent</i> on the pressure–volume lab. Same systemic support; end-diastolic pressure falls from the mid-thirties back to single figures.'],
  notes:'The chapter says venting is mandated where the aortic valve does not open, or opens infrequently. Say that sentence as written — it is the strongest recommendation in the acute section.'});

S(EC,'Biventricular support configurations','',
  'Percutaneous biventricular support is sometimes called <b>BiPELLA</b>. Early reports exist; its effect on short- and long-term outcomes <b>remains unknown</b>.',

S(EC,'CentriMag',['What it is::An extracorporeal, continuous-flow, <b>magnetically levitated</b> centrifugal pump.','What it drives::LV support, RV support, or as the driver for centrally or peripherally cannulated ECMO.'],'',

S(RV,'Ventricular interdependence and the interventricular septum','','',

S(RV,'Right ventricular anatomy and physiology','',
  'Unlike the LV, the RV is perfused <b>throughout the cardiac cycle</b>. So a big rise in RV end-diastolic pressure without a matching rise in arterial pressure can make it ischaemic.',
  ['ch14 p.2','ch14 p.4'],
  {type:'nums',nums:[
   ['Muscle mass vs LV','1/6','','Same stroke volume, about 25% of the work',''],
   ['Free wall thickness','3–5','mm','Thin, compliant, trabeculated',''],
   ['Septal share of RV output','up to 40','%','Which is what an LVAD takes away','warn'],
   ['PV loop shape in chronic HF','trapezoid → rectangle','','It starts to look like a left ventricle','']],
   notes:'The trabeculae are an efficient way to gain power without a thick wall. In chronic HF the RV loop changes shape, which tells you it has been adapting to volume overload for a long time.'});

S(RV,'Definition and outcome of right heart failure','',
  'Patients who need an RVAD do far worse than those who do not. This is the single biggest reason to think hard about the RV <b>before</b> you implant, not after.',
  ['ch14 p.4','ch14 p.5','ch04 p.9'],
  {type:'nums',nums:[
   ['In-hospital death — needed RVAD','48','%','','bad'],
   ['In-hospital death — LVAD only','9.5','%','','good'],
   ['1-year survival — needed RVAD','40','%','','bad'],
   ['1-year survival — LVAD only','82','%','','good']],
   co:['','The INTERMACS definition','CVP above 18 mm Hg with a cardiac index below 2.0, <b>and no</b> wedge above 18, tamponade, arrhythmia or pneumothorax to explain it. Or an RVAD. Or inotropes or inhaled nitric oxide for more than 14 days after implant. About 20% of LVAD patients need prolonged inotropes or mechanical RV support.'],
   notes:'Read the definition slowly. The exclusions matter — a high CVP with a high wedge is left-sided failure, not RV failure.'});

S(RV,'What an LVAD does to right ventricular load','',
  'Filling pressure and afterload both fall. But <b>CVP does not fall, and the CVP:wedge ratio rises</b>. The problem is not the load. It is the muscle.',
  ['ch14 p.6'],
  {type:'compare',
   cols_:['','Before LVAD','Early after','Long term'],
   rows:[
    ['Wedge pressure (mm Hg)','25','<lo>10</lo>','<lo>12</lo>'],
    ['Arterial elastance (mm Hg/mL)','1.04','<lo>0.43</lo>','<lo>0.38</lo>'],
    ['Pulmonary vascular resistance (WU)','2.22','<lo>1.50</lo>','<lo>1.17</lo>'],
    ['Pulmonary vascular compliance','2.00','<lo>4.03</lo>','—'],
    ['CVP','unchanged','<hi>unchanged</hi>','unchanged'],
    ['CVP : wedge ratio','0.47','<hi>0.85</hi>','0.56']],
   co:['crit','What this means at the bedside','In the early period the answer is not more afterload reduction — it is <b>inotropic support for RV contractility</b>. Later, as support continues, RV performance does improve and the ratio comes back down.'],
   notes:'This is the most important table in the RV section. Everyone assumes unloading the LV helps the RV. It does help the load. It does not help the muscle, and in the first weeks the muscle is the problem.'});

S(RV,'Predicting right ventricular failure',['PAPi below 2.0::(PA systolic − PA diastolic) ÷ CVP. It is purely right-sided, so it still works when the patient is on inotropes — which is when CVP:wedge stops working.','CVP : wedge above 0.63::Simple, but its link with RV failure weakens a lot once inotropes are running.','TAPSE below 7.5 mm::91% specific but only 46% sensitive. It looks at one part of the free wall and assumes the rest behaves the same.'],'',
  ['ch14 p.7','ch14 p.8','ch04 p.10'],{cols:3,
  notes:'That last line catches people out. High PA pressures before LVAD are reassuring, not alarming — they tell you the RV is still strong enough to make them.'});


S(RV,'Echo predictors of right ventricular failure',['RV : LV diameter above 0.75::A marker that the RV has remodelled out of proportion. RV free wall strain and global strain below −13% also feature.','RV stroke work index below 300::The RV cannot generate pulmonary pressure. With BUN above 39 and preoperative ventilation, these carry most of the risk.','No score is good enough alone::A Bayesian model reached 91–97% accuracy using 33–34 variables. Ordinary scores do far worse, and centres still rely on judgement.'],
  'Pulmonary hypertension is <b>not</b> a contraindication to LVAD — unlike transplant. A high PA systolic means the RV can still generate pressure, and group 2 hypertension often improves after implant.',
  ['ch14 p.7','ch14 p.8','ch04 p.10'],{cols:3,
  notes:'That last line catches people out. High PA pressures before LVAD are reassuring, not alarming — they tell you the RV is still strong enough to make them.'});

S(RV,'Devices for the right ventricle','',
  'Get in early. The data favour placing an RVAD <b>as soon as RV failure is recognised</b> rather than waiting to see if it settles.',
  ['ch14 p.9','ch14 p.10','ch05 p.10'],
  {type:'compare',
   cols_:['','Impella RP','Protek Duo','CentriMag'],
   rows:[
    ['Access','Femoral vein','<lo>Right internal jugular</lo>','Surgical or percutaneous'],
    ['Size','22 Fr pump on 11 Fr catheter','29–31 Fr dual lumen','Variable'],
    ['Inflow → outflow','IVC → PA','RA → PA','RA → PA'],
    ['Flow','4 L/min at 33,000 rpm','1.8–5.0 L/min','&gt;5 L/min'],
    ['Can the patient walk?','<hi>No</hi>','<lo>Yes</lo>','No'],
    ['Add an oxygenator?','No','<lo>Yes</lo>','Yes'],
    ['Approved duration','14 days','6 days','14 days']],
   co:['crit','Know the regulatory history','December 2022: the FDA relabelled Impella RP for up to 14 days, but only for RV failure lasting <b>under 48 hours</b> after LVAD, transplant, cardiac surgery or MI, and only without severe end-organ failure. June 2023: a Class I recall — a correction about anticoagulation precautions. It did not stop clinicians using the device.'],
   notes:'RECOVER RIGHT: 30 patients, 73% survival, average 3 days of support. That is the trial behind the approval.'});

S(RV,'Pulmonary vasodilators and RV function',['The perioperative problem is pulmonary vasoconstriction::Cardiopulmonary bypass raises pulmonary vascular resistance acutely, probably through inflammatory mediators \u2014 less nitric oxide and prostacyclin, more thromboxane A2 and endothelin.','Transfusion and protamine make it worse::Both have been shown to cause pulmonary vasoconstriction and worsen right ventricular function.'],'',
  ['ch14 p.5','ch14 p.8'],{cols:2,
  notes:'Do not oversell the drugs. The chapter is clear that the evidence base here is thin and that the operative routine matters more than the pharmacology.'});


S(RV,'Pulmonary vasodilators: agents and evidence',['What gets used::Inhaled nitric oxide, prostaglandin E1 and prostacyclin, phosphodiesterase-5 inhibitors, and endothelin receptor antagonists.','And the honest caveat::These mechanisms are well studied in general cardiac surgery, and there is a <b>dearth of evidence</b> in the mechanical support population specifically. The SOPRANO trial of macitentan after LVAD was designed to answer part of it.'],
  'In the meantime the practical routine is: aggressive diuresis, inotropes to decongest the liver while keeping perfusion, minimal transfusion, inhaled pulmonary vasodilators, and a mean arterial pressure held above 70.',
  ['ch14 p.5','ch14 p.8'],{cols:2,
  notes:'Do not oversell the drugs. The chapter is clear that the evidence base here is thin and that the operative routine matters more than the pharmacology.'});

S(RV,'Late right heart failure',['It happens well after discharge::In the HeartMate II destination therapy study, 8% — 41 of 537 patients — needed inotropes for late right heart failure, at a median of 1.3 years.','And it is lethal::Survival was 38% at one year and 22% at two years after it appeared.'],'',
  ['ch14 p.10','ch14 p.11'],{cols:2,
  notes:'The honest conclusion from the chapter is that disease progression may simply keep damaging the RV over time, and until we understand why, patients on long-term support will keep facing this.'});

S(RV,'Outcome of late right heart failure',['The risk never goes away::After the first 6 months the hazard stays flat, which means the risk of developing it continues for as long as the patient is supported.','No one has found a predictor::Three separate studies looked for baseline risk factors and found none that hold up. Only a weak trend with rising creatinine.'],
  'At transplant, patients who had developed late RV failure had <b>26% five-year survival versus 87%</b> in those who had not.',
  ['ch14 p.10','ch14 p.11'],{cols:2,
  notes:'The honest conclusion from the chapter is that disease progression may simply keep damaging the RV over time, and until we understand why, patients on long-term support will keep facing this.'});

S(TI,'Time to support and survival','',
  'Survival also fell with <b>each extra inotrope</b> started before support. The chapter calls time in shock one of the most important and least recognised factors affecting outcome — and by the time most patients reach a shock centre, it can no longer be changed.',
  ['ch05 p.4','ch05 p.5','ch66'],
  {type:'nums',nums:[
   ['Support started within 1.3 h','66','%','survival to discharge','good'],
   ['Started at 1.3–4.3 h','37','%','','warn'],
   ['Started after 4.3 h','26','%','','bad'],
   ['Patients studied','287','','Acute coronary syndrome with shock, cVAD registry','']],
   notes:'This is the most actionable slide in the acute half of the talk. Nothing else in the field produces a survival difference that large, and it requires only a faster decision.'});

S(TI,'Device selection','','',
  ['ch05 p.6','ch05 p.10','ch05 p.11','ch66'],
  {type:'lab',lab:'choose',
   notes:'Run this with the room before you give them the answer. Ask which ventricle, whether the lungs are failing, and how much flow. Everything else \u2014 access size, anticoagulation, whether they can walk \u2014 falls out of those three. Point out that the same three questions also tell you what NOT to use.'});

S(TI,'Effect of shock protocols on survival','',
  'No device trial has produced anything close to these numbers. What changed was recognition, escalation rules and weaning algorithms — not hardware.',
  ['ch05 p.5'],
  {type:'nums',nums:[
   ['Detroit initiative — before protocol','51','%','survival to device removal','bad'],
   ['Detroit initiative — after protocol','85','%','','good'],
   ['Inova — before shock team','47','%','','bad'],
   ['Inova — within 2 years of team','81','%','','good']],
   co:['good','What a shock team actually does','Agrees who to call and when. Sets escalation and weaning rules in advance. Puts one group in charge of the decision instead of three services arguing at 2am.'],
   notes:'If the audience remembers only one slide, this should be it.'});

S(TI,'Effect of preoperative temporary support on LVAD outcome','',
  'Patients who need non-IABP support are <b>sicker than other profile 1 patients</b>, even though their numbers look better by the time they reach theatre. The haemodynamics improve; the risk does not.',
  ['ch05 p.14','ch05 p.15'],
  {type:'nums',nums:[
   ['Operative death after VA-ECMO','43','%','','bad'],
   ['After TandemHeart','12','%','','warn'],
   ['Profile 1, no temporary support','18','%','','warn'],
   ['Profile 2–3, no temporary support','8','%','','good']],
   co:['','But the long game is different','Of 8432 registry patients, 26% had temporary support before implant — IABP in 80%, ECMO in 11%. One-year survival was 72% with non-IABP support versus 81% without. <b>If they survive the operation, long-term survival matches those who never needed support.</b>'],
   notes:'Two messages, and they point in opposite directions. Getting through the operation is much harder. Getting through the first year afterwards is not.'});

/* ===================== §13 PUMP PHYSIOLOGY ===================== */
S(TI,'Randomised trials of temporary support before DanGer','',
  'Seven randomised comparisons across two decades. Every one improved the haemodynamics. <b>None improved survival.</b> Most enrolled fewer than a hundred patients, and none pre-specified how quickly support had to start.',
  ['ch05 p.5','ch05 p.6','ch05 p.8'],
  {type:'compare',
   cols_:['Year','Population','Comparison','Result'],
   rows:[
    ['2005','Acute MI with shock','IABP vs TandemHeart','Haemodynamics better, survival unchanged'],
    ['2005','Acute MI with shock','IABP vs fibrinolysis and medical care','No survival benefit'],
    ['2006','Acute MI or decompensated HF','IABP vs TandemHeart','Haemodynamics better, more bleeding'],
    ['2008','Acute MI with shock','IABP vs Impella 2.5','No survival benefit'],
    ['2010','Acute MI with shock','IABP vs medical therapy','No survival benefit'],
    ['2012','Acute MI with shock','IABP vs medical therapy \u2014 <hi>IABP-SHOCK II</hi>','40% vs 41% at 30 days'],
    ['2017','Acute MI with shock','IABP vs Impella CP \u2014 IMPRESS','50% vs 46%, n=48']],
   notes:'The chapter is careful about why these were negative: small numbers, no definition of timing, and a diagnosis that covers wildly different patients. Do not let the audience conclude the devices do not work \u2014 conclude that the trials could not tell.'});

S(RP,'Series and parallel circulation','','',
  ['ch07 p.12','ch07 p.13','ch13 p.31'],
  {type:'lab',lab:'sp',
   notes:'Start at usual speed, then push it up. The LV pressure curve falls below the aortic curve, the valve stops opening, and the pulse flattens. That is series circulation, and it is the reason aortic insufficiency develops over months. Then bring it down and show the valve start moving again. This is exactly the trade-off you make at every ramp study.'});

S(RP,'Advantages of continuous-flow pumps',['Smaller::No displacement chamber, so the pump fits in the chest — and in children and small adults.','Fewer moving parts::One spinning impeller. That means it lasts longer and breaks less.','Less blood contact::Smaller surface for clot to form on.'],'',
  ['ch07 p.2','ch07 p.3','ch07 p.4'],{cols:3,
  notes:'That last line is most of the HeartMate II to HeartMate 3 story in one sentence.'});


S(RP,'Axial versus centrifugal pumps',['Quieter and more efficient::Less power, smaller batteries.','Axial vs centrifugal::Axial pushes blood along the shaft like a propeller in a pipe, at 8,000–15,000 rpm. Centrifugal throws it out sideways off a spinning disc, at 2,000–6,000 rpm.','Slower is gentler::Lower speed means <b>less shear on blood cells and less haemolysis</b> — one reason centrifugal designs won.'],
  'Bearings decide how a pump fails. A mechanical bearing is a point of friction and heat where fibrin builds up. Full magnetic levitation has no contact point at all, and wider gaps, so less shear.',
  ['ch07 p.2','ch07 p.3','ch07 p.4'],{cols:3,
  notes:'That last line is most of the HeartMate II to HeartMate 3 story in one sentence.'});

S(RP,'Two limitations of rotary pumps',['There are no valves in the pump::If power is lost, blood flows <b>backwards</b> through it immediately. How badly the patient does depends on whether their own heart can still generate forward flow. Some tolerate it; others are in shock within minutes.','The commonest serious human error::Disconnecting both power sources at once while changing batteries. If the patient is alone, the drop in blood pressure causes syncope, and then death.'],'',
  ['ch07 p.15','ch07 p.16','ch13 p.25'],{cols:2,
  notes:'Flow is estimated from motor current, not measured. That estimate is more accurate in centrifugal pumps, and more accurate still once haematocrit is taken into account.'});
