S(RP,'Fixed-speed operation and its consequences',['The pump runs at a fixed speed::It cannot sense what the patient needs. It relies on the Starling mechanism alone.','And it responds the wrong way round::Compared with a real heart, a rotary pump is <b>less sensitive to preload and more sensitive to afterload</b>. Exactly the opposite of what you want.'],
  'So it cannot increase output on exercise, cannot hold flow when the patient is hypertensive, and cannot avoid suction when filling falls. Every one of those is managed by a person, not the device.',
  ['ch07 p.15','ch07 p.16','ch13 p.25'],{cols:2,
  notes:'Flow is estimated from motor current, not measured. That estimate is more accurate in centrifugal pumps, and more accurate still once haematocrit is taken into account.'});

/* ===================== §14 DURABLE OUTCOMES ===================== */
var DU='Durable LVAD';

S(DU,'Four generations of durable LVAD','',
  'Each generation solved the complication that defined the one before it. Pulsatile pumps broke, so the field removed moving parts. Axial pumps clotted at the bearing, so the field removed the bearing.',
  ['ch66','ch13 p.1'],
  {type:'compare',
   cols_:['','HeartMate XVE','HeartMate II','HVAD','HeartMate 3'],
   rows:[
    ['Design','Pneumatic, volume displacement','Axial, ruby bearing','Centrifugal, hybrid levitation','<lo>Centrifugal, full maglev</lo>'],
    ['Where it sits','Abdominal pocket','Abdominal pocket','<lo>Pericardial space</lo>','<lo>Pericardial space</lo>'],
    ['What went wrong','<hi>Device failure</hi> — only 23% alive on support at 24 months','<hi>Pump thrombosis and stroke</hi>','<hi>Power and haemocompatibility events</hi>','Infection remains'],
    ['Status','Historic','Last US implant 2021','<hi>Withdrawn June 2021</hi>','<lo>Only durable LVAD on the US market</lo>']],
   notes:'REMATCH is the anchor: 52% one-year survival versus 25% on medical therapy, but only 23% still alive on support at two years. It proved the concept and showed how far the engineering had to go.'});

S(DU,'Survival by trial and device generation','','',
  ['ch66'],
  {type:'fig',fig:'survival',
   take:'Survival after a modern LVAD is similar to transplant for the first two to three years. Over the longer term, transplant is still better.',
   notes:'Walk it from the bottom up and let the trajectory do the arguing. 8% to 83% in eighteen years. Then be honest: this is 24-month data. dLVAD still cannot match transplant for long-term survival or quality of life.'});

S(DU,'HeartMate 3: design features',['Fully magnetically levitated rotor::No bearings, so no friction point for clot to start.','Wide flow gaps::Less shear on blood cells.','Sintered surfaces::Blood-contacting surfaces are textured to improve compatibility.'],'',
  ['ch66','ch13 p.8'],{cols:3,
  notes:'The driveline carries two sets of three wires, which makes it 6.6 mm across versus 4.2 mm for the HVAD — bigger drivelines have historically meant more infection.'});


S(DU,'The artificial pulse: two limitations',['An artificial pulse::The pump deliberately speeds up and slows down by 2,000 rpm every 2 seconds around about 5,400 rpm, to wash itself out.','But the pulse is fake in two ways::It is <b>not timed to the patient’s own QRS</b>, and it <b>does not increase when they exercise</b>.','The electronics live inside the pump::Unlike other systems. So a critical software fault may not be fixable by swapping the controller.'],
  'Five-year survival <b>58.4% versus 43.7%</b> for HeartMate II in MOMENTUM 3. Registry average 63.3%, and 76% of patients under 50 alive on support at five years.',
  ['ch66','ch13 p.8'],{cols:3,
  notes:'The driveline carries two sets of three wires, which makes it 6.6 mm across versus 4.2 mm for the HVAD — bigger drivelines have historically meant more infection.'});

S(DU,'Real-world outcomes with HeartMate 3','',
  'This is unusual and worth pointing out. Outcomes usually get <b>worse</b> when a device leaves the trial setting. Here they improved, because centres learned how to run it.',
  ['ch13 p.9','ch13 p.1'],
  {type:'nums',nums:[
   ['GI bleeding','12 → 7','%','CE-mark trial → German real-world','good'],
   ['Right heart failure','10 → 7.4','%','','good'],
   ['Stroke','18 → 0','%','','good'],
   ['Free from readmission at 1 yr','38','%','Still only this','bad'],
   ['2025 registry \u2014 1-year survival','85.9','%','Fully magnetically levitated pumps','good'],
   ['2025 registry \u2014 5-year survival','60.2','%','And 51.8% at 7 years','good'],
   ['Free from stroke at 5 years','87.1','%','2025 registry','good']],
   notes:'Balance it with the last tile. Survival is good; life on support is still hard. Only 38% get through the first year without a readmission.'});


/* ===================== §15 WHO GETS A DURABLE DEVICE ===================== */
var SEL='Choosing patients';

S(SEL,'Indication threshold for durable LVAD','',
  'Do not offer an LVAD until the risk of dying <b>without</b> one is higher than the risk of dying <b>with</b> one. Everything else in this section is a way of estimating those two numbers.',
  ['ch04 p.7'],
  {type:'nums',nums:[
   ['LVAD survival at 1 year','~82','%','The ceiling in carefully selected patients',''],
   ['So the threshold to consider one','≥18','%','Predicted 1-year mortality without a device','warn'],
   ['Avoid MCS if expected survival is','&lt;2','years','From any cause','bad'],
   ['Patients with HF who get one','a fraction','','Of more than 6 million','']],
   co:['crit','Too early is also a mistake','Implanting before end-organ damage appears has <b>not</b> improved survival compared with continuing medical therapy — it just exposes patients to the operation sooner. Implanting too late leaves permanent renal failure, pulmonary hypertension and cardiac cirrhosis. The window is narrow.'],
   notes:'This is the single most useful slide for a general cardiology audience. The 18% figure and the two-year rule together allow sensible screening of referrals.'});

S(SEL,'I-NEED-HELP: when to refer',['I — Inotropes::Needed them before, or needs them now.','N — NYHA and natriuretic peptides::Still class III or IV, and/or BNP staying high.','E — End-organ dysfunction::Kidney or liver function getting worse because of the heart.','E — Ejection fraction::Very low.','D — Defibrillator shocks::Repeated appropriate shocks.'],'',
  ['ch04 p.4','ch04 p.5'],{cols:3,
  notes:'Teach the mnemonic. It exists precisely because both doctors and patients underestimate how sick a non-inotrope-dependent patient really is.'});


S(SEL,'LVAD in ambulatory patients','',
  'Two registries and one trial tried to find the ambulatory patient who benefits. The honest position is that <b>a randomised answer does not exist</b>, partly because clinicians and patients were never in equipoise.',
  ['ch04 p.5','ch04 p.6','ch03 p.4'],
  {type:'nums',nums:[
   ['ROADMAP, 1-year survival on LVAD','80','%','As-treated, HeartMate II','warn'],
   ['On medical management','63','%','But 22% crossed over to a device','warn'],
   ['NYHA I\u2013II at 12 months, LVAD','77','%','vs 29% on medical therapy','good'],
   ['REVIVE-IT','stopped','','Before the first implant, because of pump thrombosis','bad']],
   co:['','Who was at highest risk in the registries','Peak VO\u2082 under 55% predicted or VE/VCO\u2082 slope of 40 or more \u00b7 6-minute walk under 300\u2013350 m \u00b7 natriuretic peptides that stay high on treatment \u00b7 hyponatraemia \u00b7 at least one recent heart failure admission.'],
   notes:'Add the practical point: implanting earlier, before end-organ damage, has not improved survival. Quality of life gains are real in profile 4 but generally not in 5 to 7.'});

S(SEL,'I-NEED-HELP: remaining criteria',['H — Hospitalisations::More than one for heart failure in 12 months.','E — Edema and escalating diuretics::Still fluid overloaded, or needing more and more diuretic.','L — Low blood pressure::Systolic consistently around 90 or below.','P — Prognostic medication::Cannot increase the drugs that improve survival — or has had to reduce them.'],
  'Any one of these means the disease has moved into a stage where advanced therapies should at least be discussed.',
  ['ch04 p.4','ch04 p.5'],{cols:3,
  notes:'Teach the mnemonic. It exists precisely because both doctors and patients underestimate how sick a non-inotrope-dependent patient really is.'});

S(SEL,'Exercise testing in patient selection','',
  'If the test was submaximal — a low RER — use the <b>VE/VCO₂ slope above 35</b> instead. It does not need maximal effort to be valid.',
  ['ch03 p.11','ch03 p.12','ch04 p.6'],
  {type:'nums',nums:[
   ['Peak VO₂ above 14','94','%','1-year survival','good'],
   ['Peak VO₂ at or below 14','70','%','Accepted for transplant','warn'],
   ['At or below 14 with comorbidity','47','%','','bad'],
   ['Peak VO₂ below 10','77','%','1-year <b>mortality</b>','bad'],
   ['Threshold for LVAD','≤12–14','mL/kg/min','With RER above 1.05',''],
   ['Or below','50','% predicted','',''],
   ['VE/VCO₂ above 34','worse','','Above 40 is the worst group','bad'],
   ['6-minute walk under 350 m','3.7×','mortality','Versus over 450 m','bad']],
   notes:'Peak VO2 and VE/VCO2 are independent of each other. A patient with a preserved VO2 but an abnormal ventilatory response is still high risk, and vice versa. Use both.'});

S(SEL,'Risk scores for medical therapy',['For medical therapy::Seattle Heart Failure Model and MAGGIC are the common two. Both have online calculators. C-statistics sit around 0.7.','They fail where you need them most::Scores underestimate risk in the most advanced patients — exactly the group you are trying to assess.','For post-LVAD survival it is worse::The HeartMate II risk score had a C-statistic of 0.64–0.71 on validation. About a third of the time, a patient who survives scores worse than one who dies.'],'',
  ['ch04 p.7','ch03 p.17','ch03 p.18'],{cols:3,
  notes:'A review in 2014 found more than 60 published models. They mostly agree on the same handful of variables: age, renal function, blood pressure, sodium, ejection fraction, sex, natriuretic peptide, NYHA class, diabetes, BMI and exercise capacity.'});


S(SEL,'Renal function as a prognostic marker',[
  'It is almost universal::More than 60% of patients admitted with decompensated heart failure have an eGFR below 60, whatever the ejection fraction.',
  'And it is powerfully prognostic::An eGFR below 44 carries <b>twice the long-term mortality</b> of normal renal function. Creatinine and urea are among the strongest predictors in both acute and chronic heart failure.',
  'But read it in context::A fall in eGFR caused by an ACE inhibitor or a mineralocorticoid antagonist is <b>not</b> associated with poor outcome.',
  'And context means decongestion::A falling eGFR during an admission is only harmful if the patient is <b>not</b> being decongested at the same time. Creatinine rising while fluid comes off is a different event from creatinine rising while they stay wet.'],
  'So never read a creatinine on its own. Read it alongside the drugs and the volume status.',
  ['ch03 p.8','ch03 p.9'],{cols:2,
  notes:'This is one of the most practically useful slides for a general cardiology audience, and it is the one most likely to change what they do next week.'});

S(SEL,'Predicting survival after LVAD',['And there is a reason for that::Survival after LVAD depends mostly on <b>what happens during and after the operation</b> — events that have not occurred yet and cannot be measured beforehand.','But do not abandon them::Scores are still more accurate than clinical intuition, which is prone to bias. Use at least two, and update them as the patient changes.','More than 100 variables::Are known to predict mortality in heart failure. No single one is good enough alone.'],
  'The models are decision aids, not decisions. They are most useful for framing a conversation with the patient, the family and the payer.',
  ['ch04 p.7','ch03 p.17','ch03 p.18'],{cols:3,
  notes:'A review in 2014 found more than 60 published models. They mostly agree on the same handful of variables: age, renal function, blood pressure, sodium, ejection fraction, sex, natriuretic peptide, NYHA class, diabetes, BMI and exercise capacity.'});

S(SEL,'Frailty in LVAD candidates',[
  'How it is measured::Fried criteria — unintended weight loss over 5% or 5 kg in a year, self-reported exhaustion, low activity, slow 5-metre walk, and weak grip strength.',
  'How common::Present in 30–60% of patients admitted with heart failure, and similarly in those referred for transplant or LVAD.',
  'It predicts worse survival::Independently, after LVAD implantation.',
  'But here is the catch::Current tests cannot tell frailty <i>caused by</i> the failing heart from frailty caused by age and other disease. <b>About half of frail patients improve after an LVAD; about half do not.</b>'],
  'So frailty scores should be used <b>cautiously to exclude</b> anyone from a destination LVAD or transplant. A frail patient whose frailty is cardiac may become a robust one.',
  ['ch03 p.13','ch04 p.16'],{cols:2,
  notes:'This is a genuinely useful nuance for the room. Frailty is not automatically a reason to say no.'});

S(SEL,'Natriuretic peptides in monitoring',[
  'The closest thing to an ideal biomarker::Cheap, fast, widely available, with excellent sensitivity and good specificity. A low level effectively rules heart failure out.',
  'But a high level does not rule it in::Specificity is modest at best in outpatients or in acute breathlessness. Atrial fibrillation and renal dysfunction both raise it.',
  'Know who runs high anyway::Women and patients of low body weight have higher levels regardless of cardiac function.',
  'The trap \u2014 sacubitril/valsartan::Neprilysin inhibitors <b>raise BNP but not NT-proBNP</b>. If your patient is on sacubitril/valsartan you must monitor with <b>NT-proBNP</b>, or you will chase a number the drug created.'],
  'Changes over time carry more information than any single value \u2014 though trials of BNP-guided treatment have not convincingly improved outcomes.',
  ['ch03 p.8','ch03 p.9'],{cols:2,
  notes:'The sacubitril point is the highest-yield line on this slide. Most general physicians do not know it, and it is a real source of error on the ward.'});

S(SEL,'Contraindications to durable LVAD','',
  'Pulmonary hypertension is <b>not</b> on this list. Unlike transplant, it is usually group 2 and often improves after implant.',
  ['ch04 p.8','ch04 p.9','ch04 p.13'],
  {type:'compare',
   cols_:['','Why it rules the patient out'],
   rows:[
    ['End-stage renal disease','<hi>Median survival 16 days.</hi> Of 155 Medicare patients with ESRD who received an LVAD, 52% died during the index admission. Generally an absolute contraindication.'],
    ['Frank cirrhosis','Absolute contraindication. Congestive hepatopathy improves with support; established cirrhosis does not.'],
    ['Uncontrolled arrhythmia','VT or VF that cannot be controlled. Inotropes may be contraindicated too, leaving BiVAD, ECMO or TAH as the only options.'],
    ['Non-dilated ventricle','Restrictive or hypertrophic disease leaves no room for the inflow cannula. Survival is inferior in very small ventricles.'],
    ['Aortic regurgitation','Even mild AR should be addressed at implant — it progresses, and it short-circuits the pump.'],
    ['Mechanical aortic valve','Must be replaced with a bioprosthesis or patch-closed at the time of implant.'],
    ['Severe RV failure','Needing permanent RV support.'],
    ['Cannot manage the device','Severe cognitive impairment, active substance misuse, no caregiver, or no reliable power or transport.']],
   notes:'The ESRD figure is striking — median survival 16 days. State it clearly and move on.'});


/* ===================== §12b RUNNING THE SHOCK PATIENT ===================== */
var MG='Running the patient';

S(SEL,'Nutrition and body weight',['Most of these patients are malnourished::The majority with chronic heart failure have an <b>albumin below 3.2</b>, despite a high rate of obesity. Poor appetite, inflammatory cytokines, work of breathing, nausea and early satiety from a congested liver all contribute.','Cachexia predicts operative death::Low body mass index correlates with operative mortality, though not with infection.','The obesity paradox::Obesity is not associated with higher mortality until body mass index is very high \u2014 but morbid obesity carries a real risk of wound and other postoperative infection. Weight loss after implant is rarely achieved.'],'',
  ['ch04 p.14','ch04 p.15'],{cols:3,
  notes:'The diabetes point is a nice one to land: the question is not only whether the disease is controlled, but whether this person can run a complex daily routine.'});


S(SEL,'Diabetes, cancer screening and life expectancy',['Diabetes is a behaviour test as much as a disease::It raises risk through vascular disease and infection. Managing it well is a good indicator of how someone will manage a driveline \u2014 aim for <b>HbA1c under 9%</b>.','Screen for cancer properly::Age and sex appropriate screening, and investigate any iron deficiency or positive faecal occult blood before implant, given how common gastrointestinal bleeding becomes afterwards.','And the overall rule::Avoid MCS where expected survival is <b>under two years</b> from any cause.'],
  'Every one of these is modifiable or at least assessable before theatre. None of them is a reason to rush.',
  ['ch04 p.14','ch04 p.15'],{cols:3,
  notes:'The diabetes point is a nice one to land: the question is not only whether the disease is controlled, but whether this person can run a complex daily routine.'});

S(MG,'Choosing vasoactive drugs in shock',['First work out which shock this is::Calculate SVR. Vasoconstricted with low output is a different problem from vasodilated with near-normal output.','Vasoconstricted::Careful vasodilators can markedly improve output — while you guard the blood pressure. This is the situation where afterload reduction helps.'],'',
  ['ch02 p.6','ch02 p.8','ch02 p.13'],{cols:2,
  notes:'The sources cover this less than they cover devices, so keep it short and physiological. The practical message is: measure, do not guess.'});


S(MG,'Vasodilatory shock: management',['Vasodilated::Vasodilators are <b>absolutely contraindicated</b>. Vasopressin stores get used up as shock continues, which is why vasopressin works here. Angiotensin II was approved in late 2017 for high-output shock.','Watch the acidosis::Below a certain pH, adrenoreceptors are internalised and noradrenaline stops working. Escalating the pressor into a severe acidosis does not work.'],
  'The same blood pressure can come from two opposite problems. Treating the wrong one prolongs the time the tissues spend underperfused.',
  ['ch02 p.6','ch02 p.8','ch02 p.13'],{cols:2,
  notes:'The sources cover this less than they cover devices, so keep it short and physiological. The practical message is: measure, do not guess.'});

S(MG,'What to monitor in cardiogenic shock','',
  'Numbers that describe the heart predict outcome <b>less well</b> than numbers that describe the inflammation. APACHE II and IL-6 beat cardiac power and cardiac index for predicting death.',
  ['ch02 p.9','ch02 p.13','ch05 p.13'],
  {type:'nums',nums:[
   ['Lactate','the trend','','Falling is good. A flat high lactate may be poor clearance.',''],
   ['Mixed venous saturation','&lt;50','%','Often under 40 in shock. Correct for anaemia.',''],
   ['Cardiac power output','&lt;0.6','W','Rarely calculated, genuinely useful','warn'],
   ['Urine output','&lt;30','mL/h','Part of the definition, and an early organ signal','']],
   co:['crit','Why the patient can look worse than the monitor','Even after cardiac output is restored, the small vessels stay damaged. That is what keeps the blood pressure low, the coagulation deranged and the organs failing — and it is why technical success is not the same as recovery.'],
   notes:'If they take one thing: follow the trend in lactate, not the single value.'});

S(MG,'Escalation and weaning protocols','',
  'Every trial that randomised a <b>device</b> was neutral or negative. Every programme that introduced a <b>protocol</b> reported a large improvement. That should tell you where the effort belongs.',
  ['ch05 p.5','ch05 p.13','ch66'],
  {type:'nums',nums:[
   ['Detroit initiative','51 → 85','%','survival to device removal','good'],
   ['Inova','47 → 81','%','within 2 years of a shock team','good'],
   ['Support within 1.3 h','66','%','survival to discharge','good'],
   ['Each extra inotrope first','worse','','Survival fell with the number used before support','bad']],
   notes:'Say plainly that the protocol evidence is observational, not randomised. It is still the most consistent signal in the field.'});

S(MG,'Patients who should not be escalated',['No plausible exit::Temporary support gives you time to decide. If there is no recovery, no transplant and no durable device at the end of it, it achieves nothing.','Multiple active comorbidities::Patients with social or medical problems that will limit long-term survival should usually not be offered temporary support.'],'',
  ['ch05 p.5','ch04 p.16','ch66'],{cols:2,
  notes:'This is the ethically hardest slide in the talk. Make the point that starting a device is easy and stopping one is not.'});

/* ===================== §16 ADVERSE EVENTS ===================== */
var AE='Adverse events';


S(MG,'Agreeing the plan before starting support',['The institution matters::Complexity and cost limit what is available. Smaller units may have one device and a transfer, which is itself a delay.','Decide before you cannulate::Agree the sequence — what comes after this device, and what the stopping rule is — before it goes in, not afterwards.'],
  'This is a heart-team decision, and the chapter is explicit that the whole multidisciplinary team should agree the plan <b>before</b> temporary support starts where that is possible.',
  ['ch05 p.5','ch04 p.16','ch66'],{cols:2,
  notes:'This is the ethically hardest slide in the talk. Make the point that starting a device is easy and stopping one is not.'});

/* ===================== §16 ADVERSE EVENTS ===================== */
var AE='Adverse events';

S(AE,'Adverse events: older pumps versus HeartMate 3','','',
  ['ch66','ch13 p.9'],
  {type:'lab',lab:'ae',
   notes:'Toggle early and late. Early, the two generations look alike because early events reflect how sick the patient was. Late, the difference appears because late events come from the pump. Point at device malfunction and stroke falling by three-quarters. Then point at infection: 18 to 17. That is the slide.'});

S(AE,'Causes of death on LVAD support','',
  'Neurological events carry the <b>greatest cumulative risk of death</b> over six years, then infection. Right heart failure kills early; infection has an early peak, then climbs again after about two years.',
  ['ch13 p.10','ch13 p.11','ch13 p.12'],
  {type:'nums',nums:[
   ['Greatest cumulative cause of death','neurological','','Over 6 years of support','bad'],
   ['Second','infection','','Rises again after 2 years','bad'],
   ['Earliest peak','right heart failure','','Highest hazard just after implant','bad'],
   ['Free from readmission at 1 year','38','%','','bad']],
   co:['crit','Events in the first 3 months predict the next 2 years','A registry analysis of patients alive at 3 months found that the <b>number</b> of strokes, respiratory failures, infections and device malfunctions in those first 3 months each independently predicted death between 3 and 24 months. So did days in acute care, and a lower quality-of-life score.'],
   notes:'The practical message: a rocky first 3 months is not just a rocky first 3 months. It changes the whole trajectory.'});

S(AE,'Stroke','',
  'Over <b>80% of strokes happen after the first two weeks</b>, so this is an outpatient problem, not a surgical one. Blood pressure control and careful anticoagulation monitoring are what reduce it.',
  ['ch13 p.20','ch13 p.21','ch13 p.22'],
  {type:'nums',nums:[
   ['Had at least one stroke','11','%','Registry, 2012–2015','bad'],
   ['Cumulative at 3 years','15','%','8% haemorrhagic, 7% ischaemic','bad'],
   ['MOMENTUM 3 at 2 years','19 → 10','%','HeartMate II → HeartMate 3','good'],
   ['Survival 6 months after ischaemic stroke','66','%','81% at one month','warn'],
   ['Survival 6 months after haemorrhagic','35','%','45% at one month','bad'],
   ['Chance of transplant after a stroke','halved','','',''],
   ['Strokes during active infection','40','%','Infection and GI bleeding both raise the risk','bad'],
   ['2025 registry \u2014 free from stroke at 5 yr','87.1','%','Fully magnetically levitated pumps','good']],
   notes:'The 40% figure is the one worth emphasising — infection is not just an infection problem, it is a stroke risk factor.'});

S(AE,'Perioperative bleeding',[
  'A third need to go back::Nearly one in three patients require reoperation for bleeding after implant.',
  'And one problem leads to the next::Transfusion raises the risk of infection, allosensitisation and acute lung injury. With lung injury and bleeding the right ventricle fails, pump output falls, organs suffer and survival drops.',
  'Chronic right heart failure brings its own coagulopathy::Congestive hepatopathy does the rest. The <b>MELD score</b> \u2014 creatinine, bilirubin and INR \u2014 correlates with both bleeding and death after implant.',
  'So normalise the INR first::Long-term warfarin and antiplatelet drugs add to it, especially after previous cardiac surgery. Patients in profile 1 are the most coagulopathic of all.'],
  'If coagulopathy persists after protamine, leaving the chest packed with a wound vacuum system and closing the sternum later is safe and common practice.',
  ['ch13 p.14'],{cols:2,
  notes:'This is a surgical slide but it matters to physicians, because the decision to implant a profile 1 patient is partly a decision to accept this.'});

S(AE,'Gastrointestinal bleeding',['How much worse::Ten times the rate of the old pulsatile pumps — 46.5 versus 4.7 events per 100 patient-years. At one year, 95% of pulsatile patients were free of GI bleeding versus 66% on continuous flow.','What you see on endoscopy::Angiodysplasia, usually multiple, in the stomach or upper small bowel.'],'',
  ['ch13 p.19','ch13 p.20'],{cols:2,
  notes:'If right heart failure is present, the high central venous pressure keeps those malformations open and makes the bowel ischaemic — another reason RV failure and GI bleeding travel together.'});


S(AE,'Acquired von Willebrand syndrome',['The mechanism, named::High shear across the impeller unwinds the large von Willebrand multimers, and ADAMTS13 then cuts them up. That is an <b>acquired von Willebrand syndrome</b> — the same lesion as Heyde syndrome in aortic stenosis.','And low pulsatility helps it along::Reduced pulse pressure appears to promote the small vessel malformations themselves. One study found near-total depletion of von Willebrand factor at the time of a bleed.'],
  'Registry GI bleeding at 2 years fell from 30% to 18% moving from HeartMate II to HeartMate 3. Patients over 60 are more susceptible.',
  ['ch13 p.19','ch13 p.20'],{cols:2,
  notes:'If right heart failure is present, the high central venous pressure keeps those malformations open and makes the bowel ischaemic — another reason RV failure and GI bleeding travel together.'});

S(AE,'Infection on LVAD support',['How common::Pneumonia 23%, bloodstream 20%, driveline 20%. Driveline infection peaks around 6 months but the risk never goes away — 20% by one year, 25% by two.','Who gets it::Sicker patients at implant, biventricular support, older age, higher BUN. Among adults, <b>younger</b> patients get more driveline infections — they move more and pull on the line.'],'',
  ['ch13 p.15','ch13 p.16','ch13 p.17','ch13 p.18'],{cols:2,
  notes:'Cumulative driveline infection rates approach 100% in some series. The awaited fix is eliminating the percutaneous driveline altogether with wireless power transfer.'});


S(AE,'ARIES-HM3: aspirin and bleeding',[
  'The question::Every patient on a durable pump takes warfarin. Does adding aspirin help, or just cause bleeding?',
  'The answer::Avoiding aspirin in HeartMate 3 patients on warfarin <b>reduced overall bleeding at two years</b>, including roughly a <b>40% reduction in gastrointestinal bleeding</b>.',
  'And without a penalty::There was <b>no increase in thromboembolism</b>.',
  'It changed the label::In 2024 the FDA removed the recommendation for routine aspirin in patients on HeartMate 3 support.'],
  'Long-term real-world data are still needed, particularly in patients with atrial fibrillation or a previous stroke. But routine aspirin is no longer the default.',
  ['ch66','ch13 p.19'],{cols:2,
  notes:'This is the most recent practice change in the whole talk and the one a consultant is most likely to ask about. Anticoagulation target for HeartMate 3 remains warfarin with an INR of 2 to 3.'});

S(AE,'Biofilm and antimicrobial tolerance',['Why antibiotics alone fail::Bacteria form a biofilm on the hardware. They sense each other and switch on genes that inactivate antibiotics, slow their metabolism in low-oxygen zones, and some enter a “persister” state — metabolically inert and almost untreatable.','Fungal infection is rare but lethal::Under 8% of patients, but device-related fungal infection carries 20% mortality at one month and 50% by six.'],
  'The late infection mechanism is mechanical: a tear where the driveline meets the skin, usually from pulling or twisting, lets bacteria tunnel along the line. Securing the driveline and teaching the patient is most of the prevention.',
  ['ch13 p.15','ch13 p.16','ch13 p.17','ch13 p.18'],{cols:2,
  notes:'Cumulative driveline infection rates approach 100% in some series. The awaited fix is eliminating the percutaneous driveline altogether with wireless power transfer.'});

S(AE,'Driveline care',['It starts in theatre::Minimise movement across the exit site so bacteria cannot migrate along the skin edge into the fabric that sits under the skin.','Anchor it, and keep anchoring it::Consistent stabilisation with skin stitches and an external fixation device, then teaching the patient to avoid any pulling or twisting. This is essential to preventing late infection.','The mechanism of late infection is mechanical::A tear in the healing between skin and fabric \u2014 usually from a sudden pull \u2014 lets organisms tunnel along the collagen interface. Moist granulation tissue then feeds the process.'],'',
  ['ch13 p.17','ch13 p.18'],{cols:3,
  notes:'A bigger driveline has historically meant more infection \u2014 the HeartMate II line is larger than the HVAD line and had a higher rate. The eventual fix is removing the driveline altogether.'});


S(AE,'Early recognition of driveline infection',['So the routine is simple::Periodic cleaning to remove shed skin cells and kill microbes, then a dry dressing to minimise contamination. Chlorhexidine can be added.','Catch it early::Teach the patient and the carer to report drainage, increasing pain or spreading redness immediately \u2014 photographs uploaded from home work well.','And treat granulation tissue::Silver nitrate makes exuberant moist granulations regress. If infection begins to tunnel, debride it.'],
  'A paradox worth knowing: among adults, <b>younger</b> patients get more driveline infections \u2014 they are more active, so the line takes more mechanical punishment.',
  ['ch13 p.17','ch13 p.18'],{cols:3,
  notes:'A bigger driveline has historically meant more infection \u2014 the HeartMate II line is larger than the HVAD line and had a higher rate. The eventual fix is removing the driveline altogether.'});

S(AE,'Pump thrombosis','',
  'Rates looked low in the approval trial, then rose <b>five- to six-fold between 2010 and 2012</b> once the device was in wide use. The risk was worst in the first three months.',
  ['ch13 p.27','ch13 p.28'],
  {type:'nums',nums:[
   ['HeartMate II at 1 year, approval trial','~3','%','It looked like a solved problem',''],
   ['Then rose','5\u20136\u00d7','','Once it was widely implanted','bad'],
   ['LDH above 600 at 1 month','strong predictor','','With younger age, female sex, higher BMI, severe RHF','bad'],
   ['Maglev at 5 years','2.1','%','MOMENTUM 3, HeartMate 3','good']],
   notes:'Freedom from pump malfunction or thrombosis at 5 years was 82.7% for HeartMate 3 versus 53.7% for HeartMate II or HVAD implanted over the same period.'});

S(AE,'Pump exchange and sites of thrombus formation','',
  'Mortality after a pump exchange is considerable and gets worse with each subsequent one. Infection and stroke rates rise afterwards too.',
  ['ch13 p.28','ch13 p.29'],
  {type:'nums',nums:[
   ['Plasma free haemoglobin above 40','20','%','chance of pump exchange within 6 months','bad'],
   ['Freedom from malfunction at 5 yr','82.7','%','vs 53.7% for HeartMate II or HVAD','good']],
   co:['','Where the clot forms, and why','In a bearing pump, fibrin builds on the rear bearing where there is friction and heat. It can grow into a rotor spinning at 9,000 rpm \u2014 causing severe haemolysis, and sometimes stopping the pump. A magnetically levitated rotor has no contact point and wider secondary flow paths.'],
   notes:'Haemolysis and pump thrombosis are not the same thing and the exact relationship is still under investigation \u2014 but a rising LDH is the earliest signal you get.'});
S(AE,'Approach to pump alarms',['Low flow::Flow is estimated from motor current, not measured \u2014 so first ask whether the estimate is wrong. Then think preload. Flow through a rotary pump falls when filling falls, and the pump is <b>more</b> sensitive to afterload than a real heart, so check the blood pressure too.','Suction::The cavity is being pulled down onto the inflow cannula. Causes are hypovolaemia, RV failure, tamponade or a speed set too high. It can trigger ventricular arrhythmia and promotes thrombus. Reduce speed, fill the patient, and look at the right ventricle.'],'',
  ['ch07 p.10','ch07 p.13','ch07 p.16','ch13 p.25'],{cols:2,
  notes:'This slide is deliberately about reasoning rather than a fixed algorithm, because the right answer depends on the device and the local protocol. Make that explicit.'});


S(AE,'High power and loss of power',['High power::Suggests something is making the rotor work harder \u2014 classically thrombus. Check lactate dehydrogenase and plasma free haemoglobin before you assume it is the console.','No power at all::There are no valves in the pump. Blood flows backwards immediately. Restore power first and ask questions afterwards.'],
  'The commonest serious human error is disconnecting <b>both</b> power sources while changing batteries. If the patient is alone, syncope comes first and death follows.',
  ['ch07 p.10','ch07 p.13','ch07 p.16','ch13 p.25'],{cols:2,
  notes:'This slide is deliberately about reasoning rather than a fixed algorithm, because the right answer depends on the device and the local protocol. Make that explicit.'});

S(AE,'Haemolysis: thresholds and significance','',
  'Haemolysis and pump thrombosis are not the same thing, and the exact relationship is <b>still under investigation</b>. But a rising LDH is the earliest signal you get, and it is worth following serially rather than checking once.',
  ['ch13 p.28','ch13 p.29','ch05 p.12'],
  {type:'nums',nums:[
   ['Plasma free haemoglobin above','40','mg/dL','Definition of clinical haemolysis','bad'],
   ['Chance of pump exchange within 6 months','20','%','Once haemolysis is documented','bad'],
   ['LDH above 600 at one month','strong predictor','','Of subsequent pump thrombosis','bad'],
   ['What you may see clinically','haemoglobinuria','','Dark urine, rising LDH and free haemoglobin','warn']],
   co:['crit','And the downstream problem','Free haemoglobin injures the kidneys \u2014 pigment nephropathy. This is also why haemolysis matters with temporary devices, where shear across the pump plus any thrombus on the impeller can produce it quickly.'],
   notes:'Mortality after a pump exchange is considerable and gets worse with each subsequent one, and infection and stroke rates rise afterwards. Exchanging the pump does not undo the damage.'});

S(AE,'Aortic insufficiency on LVAD support',['It is common::About one in four patients develop mild or worse AI after a year of support. On registry data, over 50% have mild AI and 15% moderate or severe by two years.','And it is <b>pancyclic</b>::In a normal heart AI happens in diastole. On an LVAD the pressure gradient across the valve is there all the time, so the leak runs through <b>systole and diastole both</b>.'],'',
  ['ch13 p.31','ch13 p.32','ch66'],{cols:2,
  notes:'A full ramp optimisation improved haemodynamics in patients with AI — but made the AI worse in 80% of them. There is no free lunch here.'});


S(AE,'Wound, pocket and pump infection',['Mediastinitis is dangerous with hardware in place::It may need debridement and coverage with rectus or omental flaps, a wound vacuum system, or in the worst case device exchange or removal.','Malnutrition drives it::Especially a <b>prealbumin below 15 mg/dL</b> in the first two weeks after implant.','Suspect a pocket infection when::Blood cultures are positive \u2014 often staphylococcal \u2014 with pain over the device. CT or ultrasound showing fluid around the pump confirms it.'],'',
  ['ch13 p.14','ch13 p.15','ch13 p.18','ch13 p.19'],{cols:3,
  notes:'The detergent point is worth saying explicitly: the soap is not sentimental, it is how you break a biofilm mechanically.'});


S(AE,'Treating pocket infection and pump endocarditis',['Treat it mechanically, not only chemically::Explore and drain, clean the surfaces, and irrigate with dilute povidone-iodine soap \u2014 the detergent action physically disrupts biofilm. Antibiotic-loaded cement beads then elute for six to eight weeks.','Pump endocarditis is rare and hard::It can involve the cannulas or the pump interior. Options are limited: device removal with transplantation, replacing an infected component, or complete device replacement.','Prophylaxis::Chlorhexidine and clipping rather than shaving, MRSA screening and decolonisation where used, and vancomycin, cefazolin and fluconazole for 24 hours.'],
  'Many patients need more than one round of irrigation and beads \u2014 and some live at home with a suppressed rather than a cured infection.',
  ['ch13 p.14','ch13 p.15','ch13 p.18','ch13 p.19'],{cols:3,
  notes:'The detergent point is worth saying explicitly: the soap is not sentimental, it is how you break a biofilm mechanically.'});

S(AE,'Assessment of aortic insufficiency on LVAD support',['So the usual echo measures mislead::Vena contracta does not account for a leak that never stops. Two better measures are the <b>diastolic flow acceleration</b> and the <b>systolic-to-diastolic peak velocity ratio in the outflow cannula</b>.','Suspect it when the numbers disagree::Device flow that is consistently higher than the measured cardiac output means blood is going round in a circle, not round the body.'],
  'Risk factors: older age, small body surface area, female sex, and any mild AI already present at implant. Closing the aortic valve at implant reduces AI — but was associated with <b>higher mortality</b>, hazard ratio 1.87.',
  ['ch13 p.31','ch13 p.32','ch66'],{cols:2,
  notes:'A full ramp optimisation improved haemodynamics in patients with AI — but made the AI worse in 80% of them. There is no free lunch here.'});

S(AE,'Arrhythmia on LVAD support',['VT reduces pump output::And VF reduces it further, because the right ventricle stops delivering blood to the lungs. How long the patient stays conscious depends on pulmonary vascular resistance.','Patients can be strikingly well tolerant::Some walk in with sustained VT. Sedate before cardioverting if they are conscious enough to need it.'],'',
  ['ch13 p.32','ch13 p.33','ch04 p.10'],{cols:2,
  notes:'Check the ICD after implant — pacing and sensing thresholds change. Newer ICDs have moved frequency to resolve the interference.'});


/* ===================== VIVA ===================== */
var QZ=[
 ['A 58-year-old is on femoral VA-ECMO for post-MI shock. On day 3 the pulse contour returns but the chest X-ray is white out. The ECMO circuit saturation is 99%. Where do you sample the arterial gas?',
  ['Femoral arterial line','Right radial arterial line','Post-oxygenator circuit port','Left radial arterial line'],1,
  'Right radial. As the ventricle recovers it pushes deoxygenated blood forward into the aortic root, so the coronaries and brain get the worst blood while the legs get ECMO blood. A femoral line samples ECMO blood and reads perfectly. This is Harlequin, or north–south, syndrome.'],
 ['Which single left-sided temporary device increases left ventricular afterload?',
  ['IABP','Impella CP','TandemHeart','Impella 5.5'],2,
  'TandemHeart. It drains the left atrium, which drops preload sharply — but it returns blood into the femoral artery, so the ventricle must push against a higher pressure. The three Impella and IABP options all reduce afterload.'],
 ['Two days after LVAD implant the CVP has not fallen, though the wedge has halved. What does that pattern mean?',
  ['The pump speed is too low','RV contractile failure, not excess afterload','Tamponade','Inflow cannula malposition'],1,
  'RV contractile failure. After implant the wedge falls from about 25 to 10 and pulmonary vascular resistance drops — the load on the RV improves. But CVP does not move and the CVP-to-wedge ratio rises from 0.47 to 0.85. The load got better; the muscle did not. The early answer is inotropic support.'],
 ['A HeartMate 3 patient has device flows consistently higher than the measured cardiac output, rising diuretic needs and worsening mitral regurgitation. What should you look for?',
  ['Pump thrombosis','Outflow graft kink','Aortic insufficiency','Driveline fracture'],2,

S(SP2,'Biventricular failure and the total artificial heart','',
  'This is why the field focuses on left-sided support. The alternative is a second LVAD placed off-label in the RA or RV — two drivelines, two sets of equipment, and right-sided thrombosis is not uncommon. But going home is <b>much more realistic</b>.',
  ['ch66','ch14 p.9'],
  {type:'nums',nums:[
   ['Survival to transplant at 1 year','45','%','Total artificial heart, 450 implants','warn'],
   ['Mortality','38','%','','bad'],

   ['Infection within 90 days','39','%','','bad'],
   ['Discharged home','27','%','Only','bad'],
   ['Median support','5.3','months','',''],
   ['Approved for','bridge to transplant','only','Not destination therapy','']],
   notes:'The Syncardia TAH remains the only FDA-approved device for long-term right-sided support. Uptake has been limited by renal dysfunction and the difficulty of discharging patients.'});

S(SP2,'Paediatric LVAD support',['HVAD came first::Approved down to a body surface area of 1.2 m² and 25 kg, and used off-label as small as 0.6 m².','Outcomes match adults::At 12 months, 46% had been transplanted or had the device removed for recovery, and 44% were still supported.'],'',
  ['ch66'],{cols:2,
  notes:'Paediatric surgeons use preoperative imaging and 3D printed models for small ventricles — speed optimisation and management are genuinely more complex.'});


S(SP2,'HeartMate 3 in children',['Children do better on some measures::Compared with young adults on the same device, bleeding and stroke rates were similar, but children had <b>fewer infections</b> (27% vs 44%) and less device malfunction or thrombosis (11% vs 19%).','HeartMate 3 followed::Paediatric labelling from December 2020, based on 35 patients with a median age of 16 — 97% survival to a median 78 days, and successful in children as small as 19 kg.'],
  'Most children needing support have dilated cardiomyopathy, alone or with neuromuscular disease. Small body size is not the same problem as a small ventricle.',
  ['ch66'],{cols:2,
  notes:'Paediatric surgeons use preoperative imaging and 3D printed models for small ventricles — speed optimisation and management are genuinely more complex.'});

S(SP2,'Operative planning: valve procedures',['Aortic regurgitation::Anything more than mild must be addressed — repair, bioprosthetic replacement, or closure. It progresses on support and short-circuits the pump. Class I.','Mechanical aortic valve::Replace with a bioprosthesis, or patch-close. Otherwise thrombus forms above or below it. Class I.','Mitral stenosis::Significant stenosis must be dealt with. Mitral regurgitation usually improves and routine repair has not shown benefit.'],'',
  ['ch66','ch04 p.11','ch13 p.31'],{cols:3,
  notes:'Left atrial appendage ligation is Class IIb with lacking data, despite the prevalence of AF and its association with stroke on support.'});


S(SP2,'Ventricular size, access and prior surgery',['Tricuspid regurgitation::Annuloplasty may be considered at moderate or worse — but <b>no study has shown better survival or consistent improvement in RV failure</b>. Class IIb.','Small ventricle::An end-diastolic diameter below 55 mm was associated with higher 1- and 2-year mortality, more early haemocompatibility events and more RV failure.','Prior sternotomy::Get a chest CT to map aortic calcification and the course of old grafts. A less invasive approach may help these patients specifically.'],
  'A thoracotomy approach for HeartMate 3 was <b>non-inferior</b> for mortality but showed no reduction in RV failure, bleeding or length of stay.',
  ['ch66','ch04 p.11','ch13 p.31'],{cols:3,
  notes:'Left atrial appendage ligation is Class IIb with lacking data, despite the prevalence of AF and its association with stroke on support.'});

S(SP2,'Bridge strategies',['Bridge to decision::Stabilise now, work out candidacy later. This is what temporary support is genuinely good at.','Bridge to recovery::Realistic in acute primary shock — myocarditis, some post-MI. In one ECMO series recovery allowed weaning in 10% of acute cases and <b>0%</b> of chronic heart failure patients.'],'',
  ['ch04 p.2','ch04 p.3','ch05 p.3','ch05 p.13'],{cols:2,
  notes:'Destination patients are not transplant candidates for reasons — age, comorbidity, social circumstances — and those same reasons make living with a device harder.'});


S(SP2,'Bridge to transplant and destination therapy',['Bridge to transplant::More than half of transplant recipients now have an LVAD at the time of transplant. The donor pool is fixed, so this caps out.','Destination therapy::Now the leading indication in the United States. No bail-out option if things go badly, which changes the conversation before implant.'],
  'The strategy should be agreed by the whole team <b>before</b> support starts, wherever that is possible — including what happens if end-organ function does not recover.',
  ['ch04 p.2','ch04 p.3','ch05 p.3','ch05 p.13'],{cols:2,
  notes:'Destination patients are not transplant candidates for reasons — age, comorbidity, social circumstances — and those same reasons make living with a device harder.'});

S(SP2,'Shared decision making',['It is preference-sensitive::MCS saves lives and on average improves quality of life, but it carries real burdens. Which trade-off is acceptable is the patient’s to make, not ours.','Not a single conversation::It should be a series of discussions over time, planned, in a setting that allows it.'],'',
  ['ch04 p.16','ch04 p.17','ch04 p.20','ch04 p.21'],{cols:2,
  notes:'Both doctors and patients underestimate illness severity and the need for advanced therapy in patients who are not yet inotrope-dependent. That is a documented finding, not an opinion.'});

S(CL,'Summary',[
  'Ask where the blood goes::Before you choose a device, say out loud where it drains from and where it returns to. That one sentence predicts the afterload effect, the anticoagulation, and the complications you should expect.',
  'Start the clock earlier::66% versus 26% survival by hours to support. Nothing else in this field produces a difference that size, and it costs only a faster decision.',
  'Protect the right ventricle::It has a sixth of the muscle, does a quarter of the work, and loses up to 40% of its help the moment you unload the left side. Needing an RVAD takes one-year survival from 82% to 40%.'],
  'In summary: temporary support usually improves survival only in the short term, and many patients still die of heart failure in the weeks to months after discharge. Durable support offers over 60% survival at five years in carefully chosen patients.',
  ['ch05 p.4','ch14 p.5','ch66'],{cols:3,
  notes:'Finish here if you are short of time. The viva slide that follows is optional and works well as an interactive close if there are 10 minutes left.'});

    h+='<polyline points="'+eL.join(' ')+'" fill="none" stroke="#6E8B96" stroke-width="1.6" stroke-dasharray="6 5"/>';

    h+='<polyline points="'+dL.join(' ')+'" fill="none" stroke="#6E8B96" stroke-width="1.6" stroke-dasharray="6 5"/>';
    h+='<text x="'+(X1-6)+'" y="'+(Y1+16)+'" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" fill="#6E8B96">ESPVR</text>';
    h+='<text x="'+(X1-6)+'" y="'+(py(edp(300))-8)+'" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" fill="#6E8B96">EDPVR</text>';
    h+='<polygon points="'+gpts+'" fill="none" stroke="#6E8B96" stroke-width="1.6" stroke-dasharray="5 5" opacity=".75"/>';
    h+='<polygon points="'+pts+'" fill="rgba(255,94,107,.16)" stroke="#FF5E6B" stroke-width="3" stroke-linejoin="round"/>';
    /* tracer */
    var cum=[0],tot=0,Q=P.map(function(q){return [px(q[0]),py(q[1])];});
    for(i=1;i<Q.length;i++){var dx=Q[i][0]-Q[i-1][0],dy=Q[i][1]-Q[i-1][1];tot+=Math.sqrt(dx*dx+dy*dy);cum.push(tot);}
    var u=RM?0.5:((t%0.8)/0.8), dd=u*tot, lo=0,hi=cum.length-1,mid;
    while(lo<hi-1){mid=(lo+hi)>>1; if(cum[mid]<=dd) lo=mid; else hi=mid;}
    var seg=cum[hi]-cum[lo]||1, ff=(dd-cum[lo])/seg;
    var cx=Q[lo][0]+(Q[hi][0]-Q[lo][0])*ff, cy=Q[lo][1]+(Q[hi][1]-Q[lo][1])*ff;
    h+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="15" fill="#FF5E6B" opacity=".22"/>';
    h+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="7" fill="#FF5E6B" stroke="#122229" stroke-width="2.4"/>';
    h+='<text x="'+((X0+X1)/2)+'" y="426" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="15" fill="#9FB8C2">LV volume (mL)</text>';
    h+='<text x="20" y="'+((Y0+Y1)/2)+'" text-anchor="middle" transform="rotate(-90 20 '+((Y0+Y1)/2)+')" font-family="IBM Plex Mono,monospace" font-size="15" fill="#9FB8C2">LV pressure (mm Hg)</text>';
    CFG.pv.last={ved:ved,ves:ves,sv:sv,ed:ed,flow:flow,esp:esp};
    return h+'</svg>';
  },
  rd:function(){var L=CFG.pv.last||{ved:260,ves:190,sv:70,ed:27,flow:0};
    var ef=Math.round(L.sv/L.ved*100);
    return [['End-diastolic volume',Math.round(L.ved),'mL',''],
            ['LV end-diastolic pressure',Math.round(L.ed),'mm Hg',L.ed>30?'bad':''],
            ['Native stroke volume',Math.round(L.sv),'mL',''],
            ['Device flow',L.flow.toFixed(1),'L/min',L.flow>0?'good':'']];
  }
},

/* ---------- IABP COUNTERPULSATION ---------- */
iabp:{
  states:['off','on'], init:'on', anim:true,
  label:{off:'IABP off',on:'IABP on · 1:1'},
  fbtxt:{
   off:'The normal aortic trace. A systolic peak, the dicrotic notch as the aortic valve shuts, then pressure falls away through diastole. The coronaries fill on that falling part.',
   on:'The balloon <b>inflates at the dicrotic notch</b>, which pushes blood back into the coronaries. It <b>deflates just before systole</b>, so the ventricle ejects against a lower pressure. The result is less work and less oxygen used — about 40 cc a beat, roughly 1 L/min.'},
  draw:function(st,t){
    var on=st==='on';
    var W=660,X0=54,X1=470,Y0=250,Y1=40;
    var h='<svg viewBox="0 0 660 430">';
    /* pressure trace, 2 beats */
    function P(ph){ /* ph 0..1 within a beat */
      var sys= ph<0.33 ? Math.sin(ph/0.33*Math.PI)*1 : 0;
      var base=62, peak=48;
      var v=base+peak*sys;
      if(ph>=0.33){
        var d=(ph-0.33)/0.67;
        v=base+26*Math.exp(-d*2.4);
        if(on) v+= 44*Math.exp(-Math.pow((d-0.16)/0.19,2));
        if(on && d>0.80) v-= 16*((d-0.80)/0.20);
      }
      return v;
    }
    var pts=[],i,N=240;
    for(i=0;i<=N;i++){var x=X0+(X1-X0)*i/N, ph=(i/N*2)%1, v=P(ph);
      pts.push(x.toFixed(1)+','+(Y0-(v-40)/110*(Y0-Y1)).toFixed(1));}
    for(i=0;i<=110;i+=25){var yy=Y0-(i)/110*(Y0-Y1);
      h+='<line x1="'+X0+'" y1="'+yy+'" x2="'+X1+'" y2="'+yy+'" stroke="#1A323C" stroke-width="1"/>'
       + '<text x="'+(X0-8)+'" y="'+(yy+5)+'" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="13" fill="#6E8B96">'+(40+i)+'</text>';}
    h+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+(on?'#FF5E6B':'#9FB8C2')+'" stroke-width="3"/>';
    h+='<text x="'+X0+'" y="'+(Y0+24)+'" font-family="IBM Plex Mono,monospace" font-size="14" fill="#9FB8C2">aortic pressure (mm Hg) · two beats</text>';
    if(on){
      h+='<text x="'+(X0+96)+'" y="'+(Y1+4)+'" font-family="IBM Plex Mono,monospace" font-size="13" fill="#F5C451">diastolic augmentation</text>';
      h+='<text x="'+(X0+250)+'" y="'+(Y0-6)+'" font-family="IBM Plex Mono,monospace" font-size="13" fill="#43DD97">↓ end-diastolic pressure</text>';
    }
    /* balloon */
    var ph=RM?0.6:((t%0.9)/0.9);
    var infl = on ? (ph>=0.33 ? Math.max(0,Math.sin((ph-0.33)/0.67*Math.PI)) : 0) : 0;
    var bx=560, by0=70, bh=210, bw=14+infl*40;
    h+='<rect x="'+(bx-11)+'" y="'+(by0-26)+'" width="22" height="'+(bh+58)+'" rx="11" fill="#122229" stroke="#22414E" stroke-width="1.6"/>';
    h+='<rect x="'+(bx-bw/2)+'" y="'+by0+'" width="'+bw+'" height="'+bh+'" rx="'+(bw/2)+'" fill="rgba(255,94,107,'+(0.18+infl*0.42)+')" stroke="#FF5E6B" stroke-width="2.2"/>';
    h+='<text x="'+bx+'" y="'+(by0+bh+50)+'" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="14" fill="#9FB8C2">descending aorta</text>';
    h+='<text x="'+bx+'" y="'+(by0-40)+'" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="15" fill="'+(infl>0.4?'#FF5E6B':'#6E8B96')+'">'+(infl>0.4?'INFLATE':'deflate')+'</text>';
    h+='<text x="'+bx+'" y="'+(by0-16)+'" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#6E8B96">'+(infl>0.4?'diastole':'systole')+'</text>';
    return h+'</svg>';
  },
  rd:function(st){return [['Volume displaced','~40','cc/beat',''],['Cardiac output added','~1','L/min',''],
    ['Inflates','diastole','',''],['Deflates','pre-systole','','']];}
},

/* ---------- HEAD CURVE ---------- */
hq:{
  states:['axial','centrifugal'], init:'centrifugal', anim:true, slider:'Pump speed', lvl0:0.55,
  label:{axial:'Axial · steep curve',centrifugal:'Centrifugal · flat curve'},
  fbtxt:{
   axial:'A <b>steep</b> line. A change in ΔP barely changes the flow, so flow hardly varies through the cardiac cycle — <b>less of a pulse</b>. It also keeps pumping against higher pressure, so it is more likely to suck the ventricle down when filling drops.',
   centrifugal:'A <b>flat</b> line. The same change in ΔP changes the flow a lot, so flow swings between systole and diastole — <b>a bigger pulse</b>. It also stops pumping at a lower pressure, so it is less likely to collapse the ventricle.'},
  draw:function(st,t,lvl){
    var flat=st==='centrifugal', L=(lvl==null?0.6:lvl);
    var X0=70,X1=600,Y0=330,Y1=30, FM=10, PM=140;
    var px=function(f){return X0+f/FM*(X1-X0);}, py=function(p){return Y0-p/PM*(Y0-Y1);};
    var h='<svg viewBox="0 0 660 430">';
    var i;
    for(i=0;i<=10;i+=2) h+='<line x1="'+px(i)+'" y1="'+Y1+'" x2="'+px(i)+'" y2="'+Y0+'" stroke="#1A323C"/><text x="'+px(i)+'" y="'+(Y0+21)+'" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#6E8B96">'+i+'</text>';
    for(i=0;i<=140;i+=35) h+='<line x1="'+X0+'" y1="'+py(i)+'" x2="'+X1+'" y2="'+py(i)+'" stroke="#1A323C"/><text x="'+(X0-9)+'" y="'+(py(i)+5)+'" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="13" fill="#6E8B96">'+i+'</text>';
    /* family of speed curves */
    function dp(f,sp){ var shut = flat ? 55+sp*75 : 80+sp*80; var k = flat ? 5.2 : 13.5; return Math.max(0, shut - k*f*(flat?1:1)); }
    for(var s2=0.2;s2<=1.01;s2+=0.2){
      var seg=[]; for(i=0;i<=10;i+=0.25){var v=dp(i,s2); if(v>0) seg.push(px(i)+','+py(v));}
      h+='<polyline points="'+seg.join(' ')+'" fill="none" stroke="#22414E" stroke-width="1.5"/>';
    }
    var cur=[]; for(i=0;i<=10;i+=0.2){var v2=dp(i,L); if(v2>0) cur.push(px(i)+','+py(v2));}
    h+='<polyline points="'+cur.join(' ')+'" fill="none" stroke="'+(flat?'#4FB6F0':'#F5C451')+'" stroke-width="3.4"/>';
    /* operating point oscillating with the cardiac cycle: dP swings systole/diastole */
    var ph=RM?0.5:((t%0.85)/0.85);
    var dpNow = 78 - 30*Math.max(0,Math.sin(ph*Math.PI/0.35))*(ph<0.35?1:0);
    var shut = flat ? 55+L*75 : 80+L*80, k = flat ? 5.2 : 13.5;
    var fNow = Math.min(FM*0.97, Math.max(0,(shut-dpNow)/k));
    var lo=Math.min(FM*0.97,Math.max(0,(shut-78)/k)), hiF=Math.min(FM*0.97,Math.max(0,(shut-48)/k));
    h+='<line x1="'+px(lo)+'" y1="'+py(78)+'" x2="'+px(hiF)+'" y2="'+py(48)+'" stroke="#FF5E6B" stroke-width="1.6" stroke-dasharray="5 4" opacity=".8"/>';
    h+='<circle cx="'+px(fNow)+'" cy="'+py(dpNow)+'" r="14" fill="#FF5E6B" opacity=".22"/>';
    h+='<circle cx="'+px(fNow)+'" cy="'+py(dpNow)+'" r="7" fill="#FF5E6B" stroke="#122229" stroke-width="2.4"/>';
    h+='<text x="'+((X0+X1)/2)+'" y="'+(Y0+52)+'" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="15" fill="#9FB8C2">pump flow (L/min)</text>';
    h+='<text x="20" y="'+((Y0+Y1)/2)+'" text-anchor="middle" transform="rotate(-90 20 '+((Y0+Y1)/2)+')" font-family="IBM Plex Mono,monospace" font-size="15" fill="#9FB8C2">ΔP  aorta − LV  (mm Hg)</text>';
    h+='<text x="'+px(hiF)+'" y="'+(py(48)-14)+'" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#FF5E6B">systole</text>';
    h+='<text x="'+px(lo)+'" y="'+(py(78)+22)+'" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#FF5E6B">diastole</text>';
    CFG.hq.last={sw:(hiF-lo)};
    return h+'</svg>';
  },
  rd:function(st){var sw=(CFG.hq.last&&CFG.hq.last.sw)||0;
    return [['Flow swing, systole − diastole',sw.toFixed(1),'L/min',sw>2?'good':''],
            ['Pulsatility',sw>2?'greater':'blunted','',sw>2?'good':'bad'],
            ['Shut-off pressure',st==='centrifugal'?'lower':'higher','',''],
            ['Suction tendency',st==='centrifugal'?'less':'more','',st==='centrifugal'?'good':'bad']];}
},

/* ---------- SEPTAL SHIFT / VENTRICULAR INTERDEPENDENCE ---------- */
septum:{
  states:['normal','biv','lvad'], init:'biv', anim:true, slider:'LVAD speed', lvl0:0.35,
  label:{normal:'Normal',biv:'Biventricular failure',lvad:'On LVAD support'},
  fbtxt:{

   biv:'Both ventricles are dilated and the septum is <b>flat</b>. It is already helping less before any device goes in — which is why a borderline RV tips over after implant.',
   lvad:'Drag the speed. As the LV empties, the septum moves <b>left, into the LV</b>. It stops helping the RV pump. At the same time the device sends more blood back to a thin, weak RV. Push the speed high and the cavity collapses — a <b>suction event</b>.'},
  draw:function(st,t,lvl){
    var L=(lvl==null?0.35:lvl);
    var shift = st==='normal' ? -0.55 : (st==='biv' ? 0.02 : (-0.12 + L*1.05));
    var beat = RM?0:Math.sin((t%0.85)/0.85*Math.PI*2)*0.5+0.5;
    var sc = 1 - beat*(st==='normal'?0.07:0.025);
    var cx=372, cy=212, k=shift*62;
    var topY=112, botY=312, sx=326;
    var h='<svg viewBox="0 0 660 430">';
    h+='<g transform="translate('+cx+','+cy+') scale('+sc.toFixed(3)+') translate('+(-cx)+','+(-cy)+')">';
    /* LV cavity */
    h+='<path d="M'+sx+','+topY+' A 112,100 0 1 1 '+sx+','+botY+' Q '+(sx+k)+','+cy+' '+sx+','+topY+'" fill="rgba(255,94,107,.14)" stroke="#FF5E6B" stroke-width="3"/>';

sp:{

   high:'The pump takes over completely. LV pressure never reaches aortic pressure, so the <b>aortic valve never opens</b>. This is <b>series</b> circulation — almost no pulse, and a valve that stays shut. That is what drives aortic insufficiency over months, and it keeps blood sitting in the LV where it can clot.'},
  draw:function(st,t,lvl){

    var X0=64,X1=470,Y0=300,Y1=40, PM=140;
    var py=function(p){return Y0-p/PM*(Y0-Y1);};
    var lvPeak = 112 - sp*62, aoD = 58 + sp*26;
    var open = lvPeak > aoD+2;
    var aoPeak = open ? Math.max(aoD+6, lvPeak) : aoD + 6 - sp*3;
    var h='<svg viewBox="0 0 660 430">';

document.addEventListener('keydown',function(e){
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  var k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();render(index+1);}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();render(index-1);}
  else if(k==='Home')render(0); else if(k==='End')render(slides.length-1);
  else if(k==='n'||k==='N')$('#bnotes').click();
  else if(k==='o'||k==='O')$('#btoc').click();
  else if(k==='f'||k==='F')$('#bfs').click();
  else if(k==='Escape'){$('#toc').hidden=true;$('#notes').hidden=true;}
});
var tx=0,ty=0,tk=false;
document.addEventListener('touchstart',function(e){
  tk=e.touches&&e.touches.length===1&&!(e.target.closest&&e.target.closest('button,.fb,#toc,#notes'));
  if(tk){tx=e.touches[0].clientX;ty=e.touches[0].clientY;}
},{passive:true});
document.addEventListener('touchend',function(e){
  if(!tk||!e.changedTouches)return; tk=false;
  var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6) render(dx<0?index+1:index-1);
},{passive:true});

var tg=$('#tocg');
slides.forEach(function(s,i){
  var b=document.createElement('button'); b.type='button';
  b.innerHTML='<em>'+String(i+1).padStart(2,'0')+' &middot; '+esc(s.section)+'</em><b>'+esc(s.title)+'</b>';
  b.onclick=function(){render(i);$('#toc').hidden=true;};
  tg.appendChild(b);
});

var st=(location.hash||'').replace(/[^0-9]/g,'');
var start=st?Math.min(slides.length,Math.max(1,parseInt(st,10)))-1:0;
if(!st){try{var v=localStorage.getItem('mcsv2'); if(v!==null&&+v>=0&&+v<slides.length) start=+v;}catch(e){}}
window.addEventListener('hashchange',function(){
  var d=(location.hash||'').replace(/[^0-9]/g,''); if(!d)return;
  var k=parseInt(d,10)-1; if(k>=0&&k<slides.length&&k!==index) render(k);
});
render(start);
})();
</script>
<style>.hitd{color:var(--art);font-weight:600}.lotd{color:var(--green);font-weight:600}</style>

</body>
</html>
